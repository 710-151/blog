function cardHtml(p, stagger) {
  const type = TYPE_INFO[p.type] || TYPE_INFO.article;
  const liked = Local.hasLiked(p.id);
  const likeCount = (p.likes || 0) + (Local.hasLiked(p.id) ? 1 : 0);
  let media = '';
  if (p.cover && p.type === 'article') media = `<div class="pc-coverwrap"><img class="pc-cover" src="${esc(p.cover)}" alt="" loading="lazy" /><span class="pc-covergrad"></span><span class="pc-coverbadge">${type.icon} ${type.label}</span></div>`;
  if (p.images && p.images.length && p.type === 'photo') {
    const imgs = p.images.slice(0, 4);
    media = `<div class="pc-imgs n${imgs.length}">` + imgs.map(im => `<img src="${esc(im.src)}" alt="" loading="lazy" />`).join('') + '</div>';
  }
  if (p.type === 'video' && p.video) {
    media = p.video.poster
      ? `<div class="pc-video"><div class="pc-coverwrap"><img class="pc-cover" src="${esc(p.video.poster)}" alt="" loading="lazy" /><span class="pc-covergrad"></span><span class="pc-coverbadge">▶ 视频</span></div></div>`
      : '';
  }
  let body = '';
  if (p.type === 'quote') {
    body = `<p class="pc-quote">“${esc(p.quote || '')}”</p>`;
  } else {
    body = `<p class="pc-excerpt">${esc(p.excerpt || p.title || '')}</p>`;
  }
  const tags = (p.tags || []).slice(0, 3).map(t => `<a href="#/tag/${encodeURIComponent(t)}">#${esc(t)}</a>`).join('');
  const cmtCount = (DATA.cmtCounts && DATA.cmtCounts[p.id] || 0) + Local.cmtsOf(p.id).length;
  const isRead = Local && ReadMark && ReadMark.isRead(p.id);
  return `
  <article class="post-card" data-id="${esc(p.id)}" style="--stagger:${stagger || 0}">
    <span class="pc-glare" aria-hidden="true"></span>
    ${isRead ? '<span class="pc-readbadge">✓ 已读</span>' : ''}
    ${media}
    <div class="pc-body">
      <div class="pc-top">
        ${p.pinned ? '<span class="badge pin">置顶</span>' : ''}
        ${p.cover && p.type === 'article' ? '' : `<span class="badge type">${type.icon} ${type.label}</span>`}
        ${p.series ? `<span class="badge">${esc(p.series)}</span>` : ''}
      </div>
      ${p.type !== 'quote' ? `<h2 class="pc-title"><a href="#/post/${esc(p.id)}">${esc(p.title || '无题')}</a></h2>` : ''}
      ${body}
      ${tags ? `<div class="pc-tags">${tags}</div>` : ''}
      <div class="pc-foot">
        <span class="pf-item">🗓 ${U.fmtAgo(p.publishedAt)}</span>
        ${p.type === 'article' ? `<span class="pf-item">⏱ ${p.readingTime || 1} 分钟</span>` : ''}
        <span class="spacer"></span>
        <span class="pf-item">👁 ${U.fmtNum(Local.viewCount(p.id))}</span>
        <span class="pf-item">💬 ${cmtCount}</span>
        <span class="pf-item ${liked ? 'like-on' : ''}">♥ ${U.fmtNum(likeCount)}</span>
      </div>
    </div>
  </article>`;
}

/* ---------- 信息流（虚拟渲染：分批挂载 + IntersectionObserver 触底加载） ---------- */
const Feed = {
  pool: [],
  shown: 0,
  BATCH: 12,
  init(pool) {
    this.pool = pool;
    this.shown = 0;
    return this;
  },
  render(container) {
    container.innerHTML = `<div class="feed-grid" id="feedGrid"></div><div class="feed-sentinel" id="feedSentinel"></div><div class="feed-more" id="feedMore" hidden></div>`;
    this.grid = $('#feedGrid', container);
    this.more = $('#feedMore', container);
    this.appendBatch();
    // 触底加载
    const sentinel = $('#feedSentinel', container);
    const io = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && this.shown < this.pool.length) this.appendBatch();
    }, { rootMargin: '400px' });
    io.observe(sentinel);
  },
  appendBatch() {
    if (this.shown >= this.pool.length) {
      if (this.more) this.more.hidden = false, this.more.textContent = this.pool.length ? '— 已经到底啦 —' : '';
      return;
    }
    const frag = document.createDocumentFragment();
    const wrap = document.createElement('div');
    const batch = this.pool.slice(this.shown, this.shown + this.BATCH);
    wrap.innerHTML = batch.map((p, i) => cardHtml(p, this.shown + i < 12 ? this.shown + i : 0)).join('');
    while (wrap.firstChild) frag.appendChild(wrap.firstChild);
    this.grid.appendChild(frag);
    this.shown += batch.length;
    if (this.shown >= this.pool.length && this.more) { this.more.hidden = false; this.more.textContent = '— 已经到底啦 —'; }
  }
};

function blogBadges() {

  if (list.length >= 10) out.push(['💯', '十篇里程碑']);

/* ---------- Hero 打字机 ---------- */
function startTypewriter() {
  const el = $('#twText');
  if (!el) return;
  const phrases = (SITE.heroPhrases && SITE.heroPhrases.length)
    ? SITE.heroPhrases
    : [SITE.bio || '欢迎来到我的小站 ✨', '用文字记录生活 ✍️', '保持热爱，奔赴山海 🌄'];
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.textContent = phrases[0];
    return;
  }
  let pi = 0, ci = 0, deleting = false;
  const tick = () => {
    if (!document.body.contains(el)) return;  // 已换页，停止
    const phrase = phrases[pi];
    if (!deleting) {
      ci++;
      el.textContent = phrase.slice(0, ci);
      if (ci >= phrase.length) { deleting = true; setTimeout(tick, 2200); return; }
      setTimeout(tick, 65);
    } else {
      ci--;
      el.textContent = phrase.slice(0, ci);
      if (ci <= 0) { deleting = false; pi = (pi + 1) % phrases.length; setTimeout(tick, 350); return; }
      setTimeout(tick, 26);
    }
  };
  tick();
}

/* ---------- 数字滚动 ---------- */
function countUp(els) {
  els.forEach(el => {
    const target = Number(el.dataset.count) || 0;
    if (target <= 0) { el.textContent = '0'; return; }
    const dur = 700, t0 = performance.now();
    const fmt = target >= 10000 ? (v) => U.fmtNum(Math.round(v)) : (v) => String(Math.round(v));
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(target * eased);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

  // 密码保护
  if (p.protectedHash) {

    if (!ok) {
      view.innerHTML = `<div class="post-wrap"><div class="protect-box">

      const go = async () => {
        const v = $('#postPwd').value;
        const hash = await U.sha256('salt:' + v);
        if (hash === p.protectedHash) {

          Pages.post(view, id);
        } else { U.toast('密码不正确', 'warn'); }
      };
      $('#pwdGo').addEventListener('click', go);
      $('#postPwd').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      $('#postPwd').focus();

  }

  // 浏览计数
  const isNewView = Local.view(p.id);

  window.__readingPost = p.id;  // 供滚动记录"继续阅读"

    setTimeout(() => U.toast(`🎉 这篇内容浏览量达到 ${viewCount}！`), 800);
  }

  const type = TYPE_INFO[p.type] || TYPE_INFO.article;
  const liked = Local.hasLiked(p.id);
  const likeCount = (p.likes || 0) + (liked ? 1 : 0);
  const tags = (p.tags || []).map(t => `<a href="#/tag/${encodeURIComponent(t)}">#${esc(t)}</a>`).join('');

  // 类型专属头部媒体
  let typeMedia = '';
  if (p.cover) typeMedia += `<img class="post-cover" src="${esc(p.cover)}" alt="" loading="lazy" />`;
  if (p.type === 'video' && p.video) {
    typeMedia += p.video.provider === 'direct'
      ? `<video class="post-cover" src="${esc(p.video.src)}" controls ${p.video.poster ? `poster="${esc(p.video.poster)}"` : ''} preload="metadata"></video>`
      : `<div class="video-embed post-cover" style="aspect-ratio:16/9"><iframe src="${esc(p.video.src)}" allowfullscreen scrolling="no" frameborder="no" style="width:100%;height:100%;border:none;border-radius:14px"></iframe></div>`;
  }
  if (p.type === 'music' && p.music) {
    typeMedia += p.music.src
      ? `<div class="post-cover"><audio src="${esc(p.music.src)}" controls style="width:100%"></audio></div>`
      : `<iframe class="post-cover" src="${esc(p.music.src2 || p.music.url)}" style="width:100%;height:110px;border:none" frameborder="no"></iframe>`;
  }
  if (p.type === 'link' && p.link) {
    typeMedia += `<a class="friend-card pc-linkcard" href="${esc(p.link.url)}" data-external="${esc(p.link.url)}" target="_blank" rel="noopener nofollow">
      <div class="f-avatar">🔗</div><div><div class="f-name">${esc(p.link.title || p.link.url)}</div><div class="f-desc">${esc(p.link.desc || '')}</div></div></a>`;
  }
  if (p.exif) {
    const ex = p.exif;
    typeMedia += `<div style="color:var(--muted);font-size:12.5px;margin-top:8px">📷 ${esc([ex.make, ex.model, ex.shutter, ex.fnumber, ex.iso, ex.focal].filter(Boolean).join(' · '))}</div>`;
  }

  view.innerHTML = `
  <article class="post-wrap">
    ${!p.cover && SITE.banner ? `<div class="post-banner"><img src="${esc(SITE.banner)}" alt="" /><span class="pb-grad"></span></div>` : ''}
    <header class="post-head">
      <div class="post-meta">
        <span class="badge type">${type.icon} ${type.label}</span>
        ${p.pinned ? '<span class="badge pin">置顶</span>' : ''}
        <span class="pm">🗓 ${U.fmtDate(p.publishedAt, 'YYYY-MM-DD HH:mm')}</span>
        ${p.type === 'article' ? `<span class="pm">✍️ ${U.fmtNum(p.wordCount || 0)} 字</span><span class="pm">⏱ 约 ${p.readingTime || 1} 分钟</span>` : ''}
        <span class="pm">👁 ${U.fmtNum(viewCount)}</span>
        ${p.category ? `<span class="pm"><a href="#/category/${encodeURIComponent(p.category)}">📁 ${esc(p.category)}</a></span>` : ''}
        ${p.series ? `<span class="pm">📚 ${esc(p.series)} #${p.seriesIndex || ''}</span>` : ''}
      </div>
      ${p.type !== 'quote' ? `<h1>${esc(p.title || '无题')}</h1>` : ''}
      ${tags ? `<div class="post-tags">${tags}</div>` : ''}
    </header>
    ${typeMedia}
    ${p.type === 'quote' ? `<blockquote class="md-quote" style="font-size:20px;font-family:var(--font-serif);font-style:italic">“${esc(p.quote)}”</blockquote>` : ''}
    <div class="md post-content" id="postContent">${p.html || ''}</div>

    <div class="copyright-box">${copyrightHtml(p)}</div>

    <div class="post-actions">
      <button class="action-btn ${liked ? 'liked' : ''}" id="btnLike"><span class="heart">${liked ? '❤️' : '🤍'}</span> 点赞 <span id="likeCount">${U.fmtNum(likeCount)}</span></button>
      <button class="action-btn ${Local.isFav(p.id) ? 'liked' : ''}" id="btnFav"><span>${Local.isFav(p.id) ? '⭐' : '☆'}</span> 收藏</button>
      <button class="action-btn" id="btnShare"><span>📤</span> 分享</button>
      <button class="action-btn" id="btnTTS"><span>🔊</span> 朗读</button>
      <button class="action-btn" id="btnImmerse"><span>📖</span> 沉浸阅读</button>
      ${SITE.reward && SITE.reward.qr ? `<button class="action-btn reward" id="btnReward"><span>☕</span> 打赏</button>` : ''}
    </div>

    ${seriesNavHtml(p)}
    <nav class="post-nav" id="postNav"></nav>
    <section class="related" id="relatedBox"></section>
    <section class="comments" id="commentsBox"></section>
  </article>`;

  // 目录
  renderToc(p.toc);
  TocDrawer.fill(p.toc);
  // 上一篇下一篇
  const { prev, next } = PostUtil.prevNext(p, true);
  $('#postNav').innerHTML = `
    ${prev ? `<a href="#/post/${esc(prev.id)}"><small>← 上一篇</small>${esc(prev.title || '无题')}</a>` : '<span></span>'}
    ${next ? `<a class="next" href="#/post/${esc(next.id)}"><small>下一篇 →</small>${esc(next.title || '无题')}</a>` : '<span></span>'}`;
  // 相关推荐
  const rel = PostUtil.related(p, 3);
  $('#relatedBox').innerHTML = rel.length
    ? `<h3>🧩 相关推荐</h2><div class="feed-grid">${rel.map(cardHtml).join('')}</div>` : '';
  // 评论
  Comments.render($('#commentsBox'), p);
  // 事件
  $('#btnLike').addEventListener('click', () => {
    const now = Local.toggleLike(p.id);
    $('#btnLike').classList.toggle('liked', now);
    $('#btnLike .heart').textContent = now ? '❤️' : '🤍';
    $('#likeCount').textContent = U.fmtNum((p.likes || 0) + (now ? 1 : 0));
    if (now) clickBurst('❤️');
  });
  $('#btnFav').addEventListener('click', () => {
    const now = Local.toggleFav(p.id);
    $('#btnFav').classList.toggle('liked', now);
    $('#btnFav span').textContent = now ? '⭐' : '☆';
    U.toast(now ? '已加入收藏 ⭐' : '已取消收藏');
  });
  $('#btnShare').addEventListener('click', () => Share.open(p));
  $('#btnTTS').addEventListener('click', () => TTS.toggle(p));
  $('#btnImmerse').addEventListener('click', () => {
    Theme.applyReading(!U.store.get(LS.reading, false));
    U.toast(U.store.get(LS.reading, false) ? '已进入沉浸阅读模式（字号加大）' : '已退出沉浸模式');
  });
  const btnReward = $('#btnReward');
  if (btnReward) btnReward.addEventListener('click', () => {
    $('#rewardTitle').textContent = SITE.reward.text || '请作者喝杯咖啡';
    $('#rewardText').textContent = '如果内容对你有帮助，欢迎扫码鼓励一下～';
    $('#rewardQr').src = SITE.reward.qr;
    $('#rewardModal').hidden = false;
  });
  // 「继续阅读」位置恢复
  try {
    const r = JSON.parse(sessionStorage.getItem('blog.resume') || 'null');
    if (r && r.id === p.id) {
      sessionStorage.removeItem('blog.resume');
      setTimeout(() => {
        const total = document.documentElement.scrollHeight - innerHeight;
        if (total > 0) window.scrollTo({ top: Math.max(0, Math.min(total, total * (r.pct / 100))) });
        U.toast('📖 已恢复到上次阅读位置');
      }, 380);
    }
  } catch (e) { }
  // 图片灯箱（委托）
  const content = $('#postContent');
  content.addEventListener('click', (e) => {
    const img = e.target.closest('img.md-img, img:not(.no-zoom)');
    if (img && content.contains(img)) Lightbox.open([...content.querySelectorAll('img')], img);
  });
  // 任务清单状态恢复
  $$('.md-task', content).forEach(cb => {
    const st = Local.taskState(p.id);
    if (st[cb.dataset.task]) cb.checked = true;
    cb.addEventListener('change', () => { Local.toggleTask(p.id, cb.dataset.task); });
  });
  // 键盘翻页
  window.__postKeyNav = (e) => {
    if (e.target && typeof e.target.matches === 'function' && e.target.matches('input, textarea')) return;
    if (e.key === 'ArrowLeft' && prev) Router.go('#/post/' + prev.id);
    if (e.key === 'ArrowRight' && next) Router.go('#/post/' + next.id);
  };
};

function copyrightHtml(p) {
  const s = SITE;
  if (s.copyright === 'none') return '';
  const tpl = s.copyrightText || '本文作者：{author} · 原文链接：{link} · 转载请注明出处';
  return esc(tpl)
    .replace(/\{author\}/g, `<b>${esc(s.name || '博主')}</b>`)
    .replace(/\{link\}/g, `<b>${esc(location.href)}</b>`)
    .replace(/\{title\}/g, esc(p.title || ''));
}

function seriesNavHtml(p) {
  if (!p.series) return '';
  const list = PostUtil.visible().filter(x => x.series === p.series).sort((a, b) => (a.seriesIndex || 0) - (b.seriesIndex || 0));
  return `<div class="copyright-box" style="margin-top:20px"><b>📚 系列：${esc(p.series)}</b><ol style="margin:8px 0 0;padding-left:20px">${list.map(x => `<li>${x.id === p.id ? `<b style="color:var(--accent)">${esc(x.title || '无题')}</b>` : `<a href="#/post/${esc(x.id)}">${esc(x.title || '无题')}</a>`}</li>`).join('')}</ol></div>`;
}

function renderToc(toc) {
  if (!toc || toc.length < 3) return;
  const el = document.createElement('nav');
  el.className = 'post-toc';
  el.id = 'postToc';
  el.innerHTML = '<div class="toc-title">目录</div>' + toc.map(t => `<a class="l${t.level}" href="#${t.id}" data-tid="${t.id}">${esc(t.text)}</a>`).join('');
  document.body.appendChild(el);
  // 滚动高亮
  const heads = toc.map(t => document.getElementById(t.id)).filter(Boolean);
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        $$('#postToc a').forEach(a => a.classList.toggle('active', a.dataset.tid === en.target.id));
      }
    });
  }, { rootMargin: '-70px 0px -70% 0px' });
  heads.forEach(h => io.observe(h));
  el.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-tid]');
    if (!a) return;
    e.preventDefault();
    const t = document.getElementById(a.dataset.tid);
    if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 76, behavior: 'smooth' });
  });
  window.__tocEl = el;
}

Router.add('#/tags', (view) => {

  const max = entries[0] ? entries[0][1] : 1;
  const listHtml = entries.length ? `<div class="tagcloud">${entries.map(en => `<a href="#/tag/${encodeURIComponent(en.name)}" style="font-size:${13 + (en.count / max) * 12}px">${esc(en.name)}<span class="tn">${en.count}</span></a>`).join('')}</div>` : emptyHtml('暂无标签');
  view.innerHTML = `<div class="container page" id="tagsPage">

});

'use strict';

/* ---------- 命令面板（Ctrl+K） ---------- */
const CmdK = {
  hist: U.store.get(LS.hist, []),
  actions: [],
  open() {
    $('#cmdk').hidden = false;
    const inp = $('#cmdkInput');
    inp.value = '';
    this.renderHist();
    this.renderResults('');
    setTimeout(() => inp.focus(), 30);
  },
  close() { $('#cmdk').hidden = true; },
  renderHist() {
    const el = $('#cmdkHist');
    if (!this.hist.length) { el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = this.hist.slice(0, 6).map(h => `<span class="hist-item" data-h="${esc(h)}">${esc(h)}</span>`).join('');
  },
  renderResults(q) {
    const box = $('#cmdkResults');
    const query = (q || '').trim().toLowerCase();
    this.actions = buildActions(query);
    if (!query && !this.actions.length) { box.innerHTML = '<div class="cmdk-empty">输入关键词搜索文章，或试试这些命令 ⤴</div>'; return; }
    if (!this.actions.length) { box.innerHTML = '<div class="cmdk-empty">没有找到「' + esc(q) + '」的相关内容</div>'; return; }
    const marked = (text) => {
      if (!query) return esc(text);
      const i = text.toLowerCase().indexOf(query);
      if (i < 0) return esc(text);
      return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + query.length)) + '</mark>' + esc(text.slice(i + query.length));
    };
    let lastGroup = '';
    box.innerHTML = this.actions.slice(0, 30).map((a, i) => {
      const head = a.group && a.group !== lastGroup ? `<div class="cmdk-group">${a.group}</div>` : '';
      lastGroup = a.group || lastGroup;
      return head + `
      <div class="cmdk-item ${i === 0 ? 'active' : ''}" data-i="${i}">
        <div class="ci-icon">${a.icon}</div>
        <div class="ci-main"><div class="ci-title">${marked(a.title)}</div>${a.sub ? `<div class="ci-sub">${esc(a.sub)}</div>` : ''}</div>
        ${a.kbd ? `<span class="ci-kbd">${a.kbd}</span>` : ''}
      </div>`;
    }).join('');
  },
  pick(i) {
    const a = this.actions[i];
    if (!a) return;
    this.close();
    if (a.type === 'search') {
      this.hist = [a.title, ...this.hist.filter(x => x !== a.title)].slice(0, 10);
      U.store.set(LS.hist, this.hist);
    }
    a.run();
  }
};

function buildActions(query) {
  const acts = [];
  // 命令
  const commands = [
    { icon: '🏠', title: '回到首页', kbd: 'G H', run: () => Router.go('#/') },
    { icon: '📅', title: '归档', kbd: 'G A', run: () => Router.go('#/archive') },
    { icon: '🏷️', title: '标签云', run: () => Router.go('#/tags') },
    { icon: '🖼️', title: '相册', run: () => Router.go('#/album') },
    { icon: '📚', title: '书影音', run: () => Router.go('#/shelf') },
    { icon: '⭐', title: '我的收藏', run: () => Router.go('#/favs') },
    { icon: '🔥', title: '热门排行', run: () => Router.go('#/hot') },
    { icon: '⚡', title: '时间线', run: () => Router.go('#/timeline') },
    { icon: '🌟', title: '愿望清单', run: () => Router.go('#/wishlist') },
    { icon: '⏳', title: '纪念日倒计时', run: () => Router.go('#/countdown') },
    { icon: '💌', title: '留言板', run: () => Router.go('#/guestbook') },
    { icon: '🤝', title: '友情链接', run: () => Router.go('#/links') },
    { icon: '👋', title: '关于', kbd: 'G B', run: () => Router.go('#/about') },
    { icon: '🎲', title: '随机逛逛', kbd: 'R', run: randomPost },
    { icon: '◐', title: '切换主题', run: () => Theme.cycle() },
    { icon: '👁', title: '护眼纸张模式', run: () => { const next = !U.store.get('blog.eyecare', false); EyeCare.apply(next); U.toast(next ? '📜 护眼纸张模式已开启' : '已恢复正常显示'); } },
    { icon: '💧', title: '自定义主题色', run: () => openAccentPicker() },
    { icon: '🌓', title: '切换深浅模式', run: () => Theme.cycleMode() },
    { icon: '🔤', title: '切换字体', run: () => { const order = ['sans', 'serif', 'round']; Theme.applyFont(order[(order.indexOf(U.store.get(LS.font, 'sans')) + 1) % 3]); U.toast('字体已切换'); } }
  ];
  commands.forEach(c => {
    c.group = '⚡ 快捷操作';
    if (!query || c.title.toLowerCase().includes(query)) acts.push(c);
  });
  // 文章（预建索引）
  const idx = DATA.searchIndex || [];
  const posts = POSTS;
  if (query) {
    const results = [];
    for (let i = 0; i < idx.length; i++) {
      const it = idx[i];
      const score = (it[1].includes(query) ? 10 : 0) + (it[2].includes(query) ? 5 : 0) + (it[3].includes(query) ? 3 : 0);
      if (score > 0) results.push({ i, score });
    }
    results.sort((a, b) => b.score - a.score).slice(0, 20).forEach(r => {
      const p = posts[r.i];
      if (!p || p.private) return;
      acts.push({
        icon: (TYPE_INFO[p.type] || {}).icon || '📄', title: p.title || (p.quote || '无题').slice(0, 30),
        sub: (p.excerpt || '').slice(0, 50) || U.fmtDate(p.publishedAt),
        type: 'search', group: '📄 站内内容',
        run: () => Router.go('#/post/' + p.id)
      });
    });
  }
  return acts;
}

/* ---------- 评论 ---------- */
const Comments = {
  SENSITIVE: (SITE.sensitiveWords || []),
  render(box, post) {
    const postId = post.id;
    // 数据合并：站长精选（发布时内置） + 本地评论
    const pinned = (DATA.ownerComments || []).filter(c => c.postId === postId).map((c, i) => ({ ...c, id: c.id || ('oc-' + postId + '-' + i), isOwner: true, pinnedC: true }));
    const mine = Local.cmtsOf(postId);
    const all = [...pinned, ...mine].sort((a, b) => (b.pinnedC ? 1 : 0) - (a.pinnedC ? 1 : 0) || a.createdAt - b.createdAt);
    const roots = all.filter(c => !c.parent);
    const title = post.guestbook ? '留言' : '评论';

    box.innerHTML = `
      <h3>💬 ${title}（${all.length}）</h3>
      <div class="comment-form">
        <textarea id="cInput" placeholder="写下你的${esc(title)}…（支持表情）"></textarea>
        <div class="emoji-panel" id="emojiPanel"></div>
        <div class="comment-form-row">
          <input class="cf-name" id="cName" placeholder="昵称（可留空）" value="${esc(U.store.get('blog.nick', ''))}" />
          <span style="flex:1"></span>
          <button class="btn ghost" id="cEmoji">😊</button>
          <button class="btn primary" id="cSubmit">发布</button>
        </div>
      </div>
      <div class="comment-list">${roots.length ? roots.map(c => this.html(c, all, postId)).join('') : `<div class="empty-tip"><span class="empty-icon">💬</span>还没有${esc(title)}，来说第一句吧</div>`}</div>`;

    // 表情面板
    const emojis = ['😄', '🤣', '😊', '😍', '😘', '😜', '🤔', '😎', '🥳', '😭', '😤', '👍', '👏', '🙏', '💪', '🤝', '❤️', '💔', '✨', '🔥', '🎉', '🎂', '🌟', '🌈', '☀️', '🌙', '⚡', '☕', '🍜', '🧋', '🎮', '📚', '🎵', '🐱', '🐶', '🦊'];
    const panel = $('#emojiPanel', box);
    panel.innerHTML = emojis.map(e => `<button type="button" data-e="${e}">${e}</button>`).join('');
    $('#cEmoji', box).addEventListener('click', () => panel.classList.toggle('open'));
    panel.addEventListener('click', (e) => {
      const b = e.target.closest('[data-e]');
      if (!b) return;
      const inp = $('#cInput', box);
      inp.value += b.dataset.e;
      inp.focus();
    });
    // 提交
    const submit = () => {
      const text = $('#cInput', box).value.trim();
      if (!text) { U.toast('先写点什么吧'); return; }
      // 敏感词过滤
      let filtered = text;
      for (const w of this.SENSITIVE) filtered = filtered.split(w).join('*'.repeat(Math.min(w.length, 6)));
      // 频率限制（60 秒内最多 3 条）
      const recent = mine.filter(c => Date.now() - c.createdAt < 60000);
      if (recent.length >= 3) { U.toast('发送太频繁啦，休息一下吧', 'warn'); return; }
      const nick = $('#cName', box).value.trim() || U.randNick();
      U.store.set('blog.nick', nick);
      try {
        const log = U.store.get('blog.cmtLog', []);
        log.unshift({ postId, ts: Date.now(), text: filtered.slice(0, 30) });
        U.store.set('blog.cmtLog', log.slice(0, 50));
      } catch (e) { }
      Local.addComment(postId, {
        id: U.uid('c'), nick, content: filtered, createdAt: Date.now(), likes: 0, liked: false,
        color: U.nickColor(nick), parent: this.replyTo || null, replyToName: this.replyToName || null
      });
      this.replyTo = null; this.replyToName = null;
      this.render(box, post);
      U.toast('发布成功 ✨');
    };
    $('#cSubmit', box).addEventListener('click', submit);
    // 删除自己的评论/点赞委托
    box.addEventListener('click', (e) => {
      const like = e.target.closest('[data-clike]');
      if (like) {
        Local.likeComment(postId, like.dataset.clike);
        this.render(box, post);
        return;
      }
      const del = e.target.closest('[data-cdel]');
      if (del && confirm('删除这条评论及它的回复？')) {
        Local.delComment(postId, del.dataset.cdel);
        this.render(box, post);
        return;
      }
      const rep = e.target.closest('[data-creply]');
      if (rep) {
        this.replyTo = rep.dataset.creply;
        const target = all.find(c => c.id === this.replyTo);
        this.replyToName = target ? target.nick : '';
        const inp = $('#cInput', box);
        inp.value = `回复 @${this.replyToName}：`;
        inp.focus();
        // 滚到输入框
        inp.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });
  },
  html(c, all, postId) {
    // 无 id 的评论不允许有子回复（防自引用递归）
    const replies = c.id != null ? all.filter(x => x.parent === c.id) : [];
    const likeCount = (c.likes || 0) + (c.liked ? 1 : 0);
    return `
    <div class="comment" id="cm-${esc(c.id)}">
      <div class="c-avatar" style="background:${esc(c.color || U.nickColor(c.nick))}">${esc((c.nick || '匿')[0])}</div>
      <div class="c-body">
        <div class="c-head">
          <span class="c-name">${esc(c.nick)}</span>
          ${c.isOwner ? '<span class="c-badge">站长</span>' : ''}
          ${c.pinnedC ? '<span class="c-pin">置顶</span>' : ''}
          <span class="c-time">${U.fmtAgo(c.createdAt)}</span>
        </div>
        <div class="c-content">${esc(c.content)}</div>
        <div class="c-actions">
          <button data-clike="${esc(c.id)}" class="${c.liked ? 'liked' : ''}">👍 ${likeCount || ''}</button>
          <button data-creply="${esc(c.id)}">回复</button>
          ${c.mine ? `<button data-cdel="${esc(c.id)}">删除</button>` : ''}
        </div>
        ${replies.length ? `<div class="c-replies">${replies.map(r => this.html(r, all, postId)).join('')}</div>` : ''}
      </div>
    </div>`;
  }
};

/* ---------- 灯箱 ---------- */
const Lightbox = {
  list: [], idx: 0, scale: 1, rot: 0,
  open(srcs, imgEl, startIdx) {
    this.list = srcs.map(s => typeof s === 'string' ? s : s.src || s);
    this.idx = startIdx !== undefined ? startIdx : (imgEl ? this.list.indexOf(imgEl.getAttribute('src')) : 0);
    if (this.idx < 0) this.idx = 0;
    this.scale = 1; this.rot = 0;
    $('#lightbox').hidden = false;
    this.show();
  },
  show() {
    const img = $('#lbImg');
    img.src = this.list[this.idx];
    this.apply();
    $('#lbCount').textContent = `${this.idx + 1} / ${this.list.length}`;
    const multi = this.list.length > 1;
    $('#lbPrev').style.display = multi ? '' : 'none';
    $('#lbNext').style.display = multi ? '' : 'none';
  },
  apply() { $('#lbImg').style.transform = `scale(${this.scale}) rotate(${this.rot}deg)`; },
  step(d) { this.idx = (this.idx + d + this.list.length) % this.list.length; this.scale = 1; this.rot = 0; this.show(); },
  close() { $('#lightbox').hidden = true; }
};

/* ---------- TTS 朗读 ---------- */
const TTS = {
  on: false,
  toggle(p) {
    if (this.on) { speechSynthesis.cancel(); this.on = false; $('#btnTTS').classList.remove('liked'); return; }
    const el = $('#postContent');
    const text = (el ? el.innerText : '').replace(/\s+/g, ' ').slice(0, 5000);
    if (!text) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 1.02;
    u.onend = u.onerror = () => { this.on = false; const b = $('#btnTTS'); if (b) b.classList.remove('liked'); };
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    this.on = true;
    $('#btnTTS').classList.add('liked');
    U.toast('开始朗读，再点一次停止');
  }
};

/* ---------- 悬浮音乐播放器 ---------- */
const Player = {
  list: [], idx: 0,
  init() {
    const list = (DATA.pages && DATA.pages.musicList || []).filter(m => m.url);
    const posts = PostUtil.visible().filter(p => p.type === 'music' && p.music && p.music.src);
    posts.forEach(p => list.push({ title: p.title, artist: '', src: p.music.src }));
    if (!list.length) return;
    this.list = list;
    $('#btnMusicTop').hidden = false;
    $('#btnMusicTop').addEventListener('click', () => {
      $('#playerBar').hidden = !$('#playerBar').hidden;
      this.renderPlaylist();
    });
    $('#pbToggle').addEventListener('click', () => this.toggle());
    $('#pbListBtn').addEventListener('click', () => { const el = $('#pbPlaylist'); el.hidden = !el.hidden; });
    const audio = $('#pbAudio');
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) $('#pbProgress').style.width = (audio.currentTime / audio.duration * 100) + '%';
    });
    audio.addEventListener('ended', () => this.next());
  },
  playList(list, idx) {
    this.list = list;
    $('#playerBar').hidden = false;
    this.play(idx);
    this.renderPlaylist();
  },
  play(idx) {
    this.idx = idx;
    const m = this.list[idx];
    if (!m) return;
    const audio = $('#pbAudio');
    audio.src = m.src;
    audio.play().then(() => $('#playerBar').classList.add('playing')).catch(() => { U.toast('无法播放：' + m.title, 'warn'); });
    $('#pbTitle').textContent = m.title + (m.artist ? ' · ' + m.artist : '');
    $('#pbToggle').textContent = '⏸';
    this.renderPlaylist();
  },
  toggle() {
    const audio = $('#pbAudio');
    if (audio.paused) { audio.play().then(() => $('#playerBar').classList.add('playing')).catch(() => { }); $('#pbToggle').textContent = '⏸'; }
    else { audio.pause(); $('#playerBar').classList.remove('playing'); $('#pbToggle').textContent = '▶'; }
  },
  next() { if (this.list.length) this.play((this.idx + 1) % this.list.length); },
  renderPlaylist() {
    $('#pbPlaylist').innerHTML = this.list.map((m, i) => `
      <div class="pbp-item ${i === this.idx ? 'playing' : ''}" data-i="${i}">
        ${i === this.idx ? '♪' : '·'} ${esc(m.title)} <span class="pbp-sub">${esc(m.artist || '')}</span>
      </div>`).join('');
    $('#pbPlaylist').onclick = (e) => {
      const it = e.target.closest('[data-i]');
      if (it) this.play(Number(it.dataset.i));
    };
  }
};

/* ---------- 特效 ---------- */
const Effects = {
  fallConf: { snow: ['❄️', '❅', '❆'], sakura: ['🌸', '🌸', '🌺'], bubble: ['🫧', '🫧', '⚪'] },
  init() {
    const fx = SITE.effects || {};
    if (fx.fall && fx.fall !== 'none') this.startFall(fx.fall);
    if (fx.click) document.addEventListener('click', (e) => this.clickFx(e));
  },
  startFall(kind) {
    const chars = this.fallConf[kind] || this.fallConf.snow;
    let count = 0;
    const spawn = () => {
      if (document.hidden || count > 26) return;
      const el = document.createElement('div');
      el.className = 'effect-fall';
      el.textContent = chars[Math.floor(Math.random() * chars.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (10 + Math.random() * 14) + 'px';
      el.style.opacity = 0.5 + Math.random() * 0.5;
      el.style.animationDuration = (6 + Math.random() * 8) + 's';
      el.style.transform = `translateY(0) rotate(${Math.random() * 360}deg)`;
      $('#effectsLayer').appendChild(el);
      count++;
      setTimeout(() => { el.remove(); count--; }, 14000);
    };
    setInterval(spawn, 900);
    for (let i = 0; i < 8; i++) setTimeout(spawn, i * 250);
  },
  clickFx(e) {
    const icons = ['✨', '💫', '⭐', '🌟'];
    const el = document.createElement('div');
    el.className = 'effect-click';
    el.textContent = icons[Math.floor(Math.random() * icons.length)];
    el.style.left = (e.clientX - 8) + 'px';
    el.style.top = (e.clientY - 10) + 'px';
    $('#effectsLayer').appendChild(el);
    setTimeout(() => el.remove(), 850);
  }
};
function clickBurst(char) {
  const el = document.createElement('div');
  el.className = 'effect-click';
  el.textContent = char || '❤️';
  el.style.fontSize = '22px';
  el.style.left = '50vw';
  el.style.top = '60vh';
  $('#effectsLayer').appendChild(el);
  setTimeout(() => el.remove(), 850);
}

/* ---------- 外链确认 ---------- */
function initLinkConfirm() {
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-external], .md-link, .post-content a[href^="http"], .post-content a[href^="//"]');
    if (!a) return;
    const href = a.getAttribute('data-external') || a.getAttribute('href') || '';
    if (!/^https?:\/\//i.test(href)) return;
    // 站内链接不拦截
    if (location.href.startsWith(href.split('#')[0]) && href.includes('#')) return;
    e.preventDefault();
    $('#confirmUrl').textContent = href;
    $('#confirmGo').href = href;
    $('#linkConfirm').hidden = false;
  });
  $('#confirmCancel').addEventListener('click', () => { $('#linkConfirm').hidden = true; });
  $('#linkConfirm').addEventListener('click', (e) => { if (e.target.id === 'linkConfirm') $('#linkConfirm').hidden = true; });
}

/* ---------- 滚动行为 ---------- */
function initScroll() {
  let lastY = 0;
  const onScroll = U.throttle(() => {
    const y = window.scrollY;
    const total = document.documentElement.scrollHeight - innerHeight;
    const pct = total > 0 ? Math.min(1, y / total) : 0;
    $('#progressBar').style.width = pct * 100 + '%';
    // 进度环
    const ring = document.getElementById('rtRing');
    if (ring) ring.style.strokeDashoffset = String(119.4 * (1 - pct));
    $('#backTop').classList.toggle('show', y > 500);
    $('#backBottom').classList.toggle('show', y > 500 && y < total - 200);
    const header = $('#siteHeader');
    header.classList.toggle('hide', y > lastY && y > 200 && !$('#mobileNav').offsetParent);
    header.classList.toggle('scrolled', y > 10);
    lastY = y;
    // 文章阅读进度记录
    if (window.__readingPost) recordReading(window.__readingPost, pct);
  }, 60);
  window.addEventListener('scroll', onScroll, { passive: true });
  $('#backTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  $('#backBottom').addEventListener('click', () => window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' }));
}

/* 继续阅读记录 */
function recordReading(postId, pct) {
  if (pct < 0.03) return;
  let list = U.store.get('blog.reading', []) || [];
  list = list.filter(r => r.id !== postId);
  list.unshift({ id: postId, ts: Date.now(), pct: Math.round(pct * 100) });
  list = list.slice(0, 6);
  U.store.set('blog.reading', list);
  // 读超过 85% 记为已读
  if (Math.round(pct * 100) >= 85) ReadMark.mark(postId);
}

/* ---------- 卡片 3D 倾斜 ---------- */
function initTilt() {
  if (window.matchMedia('(pointer: coarse)').matches) return;  // 触屏跳过
  document.addEventListener('pointermove', (e) => {
    if (document.documentElement.getAttribute('data-theme') === 'opus') return;  // 纸墨风不用 3D 倾斜
    const card = e.target && e.target.closest ? e.target.closest('.post-card') : null;
    $$('.post-card.tilting').forEach(c => { if (c !== card) { c.style.transform = ''; c.classList.remove('tilting'); } });
    if (!card || !card.isConnected) return;
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    card.classList.add('tilting');
    card.style.transform = `perspective(900px) rotateX(${((0.5 - py) * 5).toFixed(2)}deg) rotateY(${((px - 0.5) * 6).toFixed(2)}deg) translateY(-3px)`;
    card.style.setProperty('--gx', (px * 100).toFixed(1) + '%');
    card.style.setProperty('--gy', (py * 100).toFixed(1) + '%');
  }, { passive: true });
}

/* ---------- V3 · 分享海报生成器 ---------- */
const SharePoster = {
  async draw(post) {
    const url = location.origin === 'null' ? location.href : location.origin + location.pathname + '#/post/' + post.id;
    const W = 900, H = 1200;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    // 背景渐变
    const styles = getComputedStyle(document.documentElement);
    const acc = styles.getPropertyValue('--accent').trim() || '#3b82f6';
    const acc2 = styles.getPropertyValue('--accent2').trim() || '#6366f1';
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, acc); g.addColorStop(1, acc2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 装饰圆
    ctx.globalAlpha = .1;
    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      ctx.arc(Math.random() * W, Math.random() * H * .5, 60 + Math.random() * 150, 0, Math.PI * 2);
      ctx.fillStyle = '#fff'; ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 白色内容卡
    const cardY = 300;
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, 60, cardY, W - 120, H - cardY - 120, 28);
    ctx.fill();
    // 顶部：站名 + 日期
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.font = 'bold 40px system-ui, "PingFang SC", "Microsoft YaHei"';
    ctx.fillText(SITE.name || '我的博客', 70, 110);
    ctx.font = '24px system-ui';
    ctx.globalAlpha = .85;
    ctx.fillText(U.fmtDate(Date.now(), 'YYYY.MM.DD'), 70, 156);
    ctx.globalAlpha = 1;
    // 标题（自动换行）
    ctx.fillStyle = '#1f2937';
    const title = (post.title || (post.quote || '无题')).slice(0, 40);
    wrapText(ctx, title, 110, cardY + 90, W - 220, 52, 'bold 42px system-ui, "PingFang SC", "Microsoft YaHei"');
    // 摘要
    ctx.fillStyle = '#6b7280';
    const ex = (post.excerpt || post.quote || '').slice(0, 80);
    wrapText(ctx, ex, 110, cardY + 200, W - 220, 34, '24px system-ui, "PingFang SC"');
    // 分隔线
    ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(110, H - 320); ctx.lineTo(W - 110, H - 320); ctx.stroke();
    // 二维码（自绘矩阵）
    try {
      const q = QR.make(url, 'M');
      const qs = 180, cell = qs / q.size, qx = W - qs - 130, qy = H - qs - 100;
      ctx.fillStyle = '#111827';
      for (let y = 0; y < q.size; y++) for (let x = 0; x < q.size; x++) {
        if (q.modules[y][x]) ctx.fillRect(qx + x * cell, qy + y * cell, cell + .5, cell + .5);
      }
      ctx.fillStyle = '#9ca3af';
      ctx.font = '18px system-ui';
      ctx.fillText('扫码阅读全文', qx + 18, qy - 14);
    } catch (e) { /* 链接过长跳过二维码 */ }
    // 作者信息
    ctx.fillStyle = '#374151';
    ctx.font = 'bold 26px system-ui, "PingFang SC"';
    ctx.fillText('© ' + (SITE.name || '博主'), 110, H - 160);
    ctx.fillStyle = '#9ca3af';
    ctx.font = '20px system-ui';
    ctx.fillText((post.type === 'article' ? `约 ${post.readingTime || 1} 分钟阅读 · ` : '') + U.fmtNum(Local.viewCount(post.id)) + ' 次浏览', 110, H - 126);
    return c;
  },
  async open(post) {
    const wrap = document.getElementById('posterWrap');
    wrap.hidden = false;
    wrap.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:14px">正在生成海报…</div>';
    try {
      const c = await this.draw(post);
      wrap.innerHTML = '';
      wrap.appendChild(c);
      // 下载按钮
      const dl = document.createElement('button');
      dl.className = 'btn primary';
      dl.textContent = '⬇️ 保存海报 PNG';
      dl.onclick = () => c.toBlob(b => U.download(b, 'poster-' + post.id + '.png'));
      wrap.appendChild(dl);
    } catch (e) {
      wrap.innerHTML = '<div style="color:var(--err);font-size:13px">海报生成失败：' + esc(e.message) + '</div>';
    }
  }
};
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function wrapText(ctx, text, x, y, maxW, lineH, font) {
  ctx.font = font;
  let line = '', yy = y;
  for (const ch of String(text)) {
    if (ctx.measureText(line + ch).width > maxW) {
      ctx.fillText(line, x, yy); line = ch; yy += lineH;
      if (yy > y + lineH * 3) { line = line.slice(0, -1) + '…'; break; }
    } else line += ch;
  }
  if (line) ctx.fillText(line, x, yy);
}

/* ---------- 粒子星系背景 ---------- */
const Galaxy = {
  running: false,
  init() {
    this.canvas = document.getElementById('galaxyCanvas');
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    window.addEventListener('resize', U.debounce(() => this.resize(), 200));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.stop();
      else if (document.documentElement.getAttribute('data-bgdeco') === 'galaxy') this.start();
    });
    this.maybeStart();
  },
  maybeStart() {
    if (document.documentElement.getAttribute('data-bgdeco') === 'galaxy') this.start();
    else this.stop();
  },
  resize() {
    this.canvas.width = innerWidth; this.canvas.height = innerHeight;
  },
  start() {
    if (this.running) return;
    if (!this.canvas || !this.ctx) this.init();
    this.running = true;
    this.resize();
    const N = Math.min(110, Math.floor(innerWidth / 12));
    this.pts = Array.from({ length: N }, () => ({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      vx: (Math.random() - .5) * .4,
      vy: (Math.random() - .5) * .4,
      r: .8 + Math.random() * 1.6
    }));
    this.mx = -9999; this.my = -9999;
    this.onMove = (e) => { this.mx = e.clientX; this.my = e.clientY; };
    document.addEventListener('pointermove', this.onMove, { passive: true });
    const styles = getComputedStyle(document.documentElement);
    this.color = styles.getPropertyValue('--accent').trim() || '#3b82f6';
    const loop = () => {
      if (!this.running) return;
      this.draw();
      this.raf = requestAnimationFrame(loop);
    };
    loop();
  },
  stop() {
    this.running = false;
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.onMove) document.removeEventListener('pointermove', this.onMove);
    if (this.ctx) this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
  },
  draw() {
    const { ctx, pts } = this;
    const W = this.canvas.width, H = this.canvas.height;
    ctx.clearRect(0, 0, W, H);
    // 更新 + 鼠标吸引
    for (const p of pts) {
      const dx = this.mx - p.x, dy = this.my - p.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 22500) { p.vx += dx * 0.000012; p.vy += dy * 0.000012; }
      p.x += p.vx; p.y += p.vy;
      p.vx *= .998; p.vy *= .998;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      p.x = Math.max(0, Math.min(W, p.x)); p.y = Math.max(0, Math.min(H, p.y));
    }
    // 连线
    ctx.lineWidth = 1;
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const a = pts[i], b = pts[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 12100) {
          ctx.globalAlpha = (1 - Math.sqrt(d2) / 110) * .22;
          ctx.strokeStyle = this.color;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    // 粒子
    ctx.fillStyle = this.color;
    for (const p of pts) {
      ctx.globalAlpha = .5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
};

/* ---------- 3D 旋转标签云 ---------- */
const Cloud3D = {
  render(container, tags) {
    if (!tags || !tags.length) return;
    const box = document.createElement('div');
    box.className = 'cloud3d-wrap';
    container.prepend(box);
    const tip = document.createElement('div');
    tip.className = 'cloud3d-tip';
    tip.textContent = '🌀 拖拽拨动标签球 · 点击标签直达';
    container.prepend(tip);
    const canvas = document.createElement('canvas');
    box.appendChild(canvas);

    const max = Math.max(...tags.map(t => t.count), 1);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const fit = () => {
      canvas.width = box.clientWidth * dpr;
      canvas.height = box.clientHeight * dpr;
    };
    fit();
    window.addEventListener('resize', U.debounce(fit, 200));

    // 斐波那契球面分布
    const N = tags.length;
    const pts = tags.map((t, i) => {
      const phi = Math.acos(1 - 2 * (i + .5) / N);
      const theta = Math.PI * (1 + Math.sqrt(5)) * i;
      return {
        tag: t,
        x: Math.sin(phi) * Math.cos(theta),
        y: Math.cos(phi),
        z: Math.sin(phi) * Math.sin(theta)
      };
    });

    let ry = 0, rx = -0.25, vy = .004, vx = .0012;
    let dragging = false, lastX = 0, lastY = 0;
    const onDown = (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; };
    const onMove = (e) => {
      if (!dragging) return;
      vy = (e.clientX - lastX) * 0.00035;
      vx = (e.clientY - lastY) * 0.00035;
      ry += (e.clientX - lastX) * 0.006;
      rx += (e.clientY - lastY) * 0.006;
      lastX = e.clientX; lastY = e.clientY;
    };
    const onUp = () => { dragging = false; };
    box.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove, { passive: true });
    window.addEventListener('pointerup', onUp);
    // 点击（拖拽距离小才算点击）
    let downX = 0, downY = 0;
    box.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
    box.addEventListener('pointerup', (e) => {
      if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 8) return;
      const hit = this.hitTest(e, box, canvas, pts, ry, rx);
      if (hit) Router.go('#/tag/' + encodeURIComponent(hit));
    });

    const R = () => Math.min(canvas.width, canvas.height) * 0.36;
    const F = () => R() * 3.2;
    const project = (p, ry, rx) => {
      // rotateY
      const x1 = p.x * Math.cos(ry) + p.z * Math.sin(ry);
      const z1 = -p.x * Math.sin(ry) + p.z * Math.cos(ry);
      // rotateX
      const y2 = p.y * Math.cos(rx) - z1 * Math.sin(rx);
      const z2 = p.y * Math.sin(rx) + z1 * Math.cos(rx);
      return { x: x1, y: y2, z: z2 };
    };
    this.hitTest = (e, boxEl, cv, pts, ry, rx) => {
      const rect = cv.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * dpr, my = (e.clientY - rect.top) * dpr;
      const cx = cv.width / 2, cy = cv.height / 2;
      let best = null, bestD = 40 * dpr;
      for (const p of pts) {
        const s = project(p, ry, rx);
        const f = F(), scale = f / (f + s.z * R());
        const x = cx + s.x * R() * scale, y = cy + s.y * R() * scale;
        const d = Math.hypot(x - mx, y - my);
        if (d < bestD) { bestD = d; best = p; }
      }
      return best ? best.tag.name : null;
    };

    const draw = () => {
      if (!document.body.contains(canvas)) { this.running = false; return; }
      if (!dragging) { ry += vy; rx += vx; rx = Math.max(-1.1, Math.min(1.1, rx)); }
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2, cy = canvas.height / 2;
      const r = R(), f = F();
      const items = pts.map(p => {
        const s = project(p, ry, rx);
        const scale = f / (f + s.z * r);
        return { p, s, scale };
      }).sort((a, b) => a.s.z - b.s.z);  // 远的先画
      for (const it of items) {
        const { p, s, scale } = it;
        const size = (12 + (p.tag.count / max) * 10) * scale * dpr;
        const alpha = 0.25 + (scale - 0.55) * 1.7;
        const x = cx + s.x * r * scale, y = cy + s.y * r * scale;
        ctx.font = `600 ${size}px system-ui, "PingFang SC", "Microsoft YaHei"`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = s.z < 0 ? hexToRgba(this.accent || '#3b82f6', Math.min(1, alpha)) :
          getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#94a3b8';
        ctx.fillText(p.tag.name + ' ' + p.tag.count, x, y);
      }
      requestAnimationFrame(draw);
    };
    // 取主题色
    this.accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#3b82f6';
    requestAnimationFrame(draw);
  }
};
function hexToRgba(hex, a) {
  const m = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})/i.exec(hex);
  if (!m) return `rgba(59,130,246,${a})`;
  return `rgba(${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)},${a})`;
}

/* ---------- 访客打卡 ---------- */
const Checkin = {
  data() { return U.store.get('blog.checkins', {}); },
  todayKey() { return new Date().toISOString().slice(0, 10); },
  streak() {
    const d = this.data();
    let n = 0;
    const day = new Date();
    if (!d[day.toISOString().slice(0, 10)]) day.setDate(day.getDate() - 1);  // 今天没打，从昨天起算
    while (d[day.toISOString().slice(0, 10)]) { n++; day.setDate(day.getDate() - 1); }
    return n;
  },
  widget() {
    const done = !!this.data()[this.todayKey()];
    const streak = this.streak();
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const first = new Date(y, m, 1);
    const days = new Date(y, m + 1, 0).getDate();
    const pad = (first.getDay() + 6) % 7;  // 周一开头
    const d = this.data();
    let cells = '';
    for (let i = 0; i < pad; i++) cells += '<span class="ck-cell dim"></span>';
    for (let i = 1; i <= days; i++) {
      const key = `${y}-${String(m + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
      const isToday = i === now.getDate();
      cells += `<span class="ck-cell ${d[key] ? 'checked' : ''} ${isToday ? 'today' : ''}">${i}${d[key] ? '<i class="ck-dot"></i>' : ''}</span>`;
    }
    return `
    <div class="checkin-card" id="checkinCard">
      <div class="checkin-head">
        <span class="ck-title">📅 访客打卡</span>
        ${streak ? `<span class="ck-streak">🔥 连续 ${streak} 天</span>` : ''}
        <span class="sp"></span>
        <span style="color:var(--muted);font-size:12px">${now.getFullYear()} 年 ${m + 1} 月</span>
      </div>
      <div class="ck-grid">${cells}</div>
      <div class="ck-btn-row">
        <button class="btn ${done ? 'ghost' : 'primary'}" id="ckBtn" ${done ? 'disabled' : ''}>${done ? '✅ 今日已打卡' : '🗓 今日打卡'}</button>
        <span class="ck-info">累计打卡 ${Object.keys(d).length} 天 · 数据保存在本机</span>
      </div>
    </div>`;
  },
  bind() {
    const btn = document.getElementById('ckBtn');
    if (!btn) return;
    btn.addEventListener('click', () => {
      const d = this.data();
      d[this.todayKey()] = true;
      U.store.set('blog.checkins', d);
      clickBurst('📅');
      U.toast('打卡成功！已坚持 ' + this.streak() + ' 天 🔥', 'ok');
      const card = document.getElementById('checkinCard');
      if (card) card.outerHTML = this.widget();
      this.bind();
    });
  }
};

/* ---------- 已读标记 + 猜你喜欢 ---------- */
const ReadMark = {
  all() { return U.store.get('blog.readIds', {}); },
  mark(id) {
    const r = this.all();
    r[id] = 1;
    U.store.set('blog.readIds', r);
  },
  isRead(id) { return !!this.all()[id]; },
  /* 按已读口味推荐：tags 权重 → 未读文章 */
  guess(n = 3) {
    const reads = Object.keys(this.all()).map(id => PostUtil.byId(id)).filter(Boolean);
    if (!reads.length) return [];
    const weight = {};
    reads.forEach(p => (p.tags || []).forEach(t => weight[t] = (weight[t] || 0) + 1));
    const hotTags = Object.entries(weight).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    return PostUtil.visible()
      .filter(p => !this.isRead(p.id))
      .map(p => {
        let score = 0;
        (p.tags || []).forEach(t => { if (hotTags.includes(t)) score += weight[t]; });
        return { p, score };
      })
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, n)
      .map(x => x.p);
  }
};

/* ---------- 移动端目录抽屉 ---------- */
const TocDrawer = {
  fill(toc) {
    const drawer = document.getElementById('tocDrawer');
    const fab = document.getElementById('tocFab');
    if (!drawer || !fab) return;
    if (!toc || toc.length < 3) { fab.style.display = 'none'; return; }
    fab.style.display = 'inline-flex';
    document.getElementById('tocDrawerList').innerHTML =
      toc.map(t => `<a class="l${t.level}" href="#${t.id}" data-tid="${t.id}">${esc(t.text)}</a>`).join('');
    fab.onclick = () => { drawer.classList.add('open'); $('#tocMask').classList.add('show'); };
    const close = () => { drawer.classList.remove('open'); $('#tocMask').classList.remove('show'); };
    $('#tocMask').onclick = close;
    drawer.querySelectorAll('a').forEach(a => a.addEventListener('click', (e) => {
      e.preventDefault();
      const t = document.getElementById(a.dataset.tid);
      if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 76, behavior: 'smooth' });
      close();
    }));
  },
  clear() {
    const fab = document.getElementById('tocFab');
    if (fab) fab.style.display = 'none';
    const drawer = document.getElementById('tocDrawer');
    if (drawer) drawer.classList.remove('open');
  }
};

/* ---------- 404 贪吃蛇 ---------- */
const Snake = {
  running: false,
  mount(container) {
    if (this.running) this.stop();
    const box = document.createElement('div');
    box.className = 'snake-box';
    box.innerHTML = '<div class="snake-title">🎮 彩蛋：方向键玩贪吃蛇（空格开始/重开）</div><canvas width="360" height="360"></canvas><div class="snake-score">得分 0 · 最高 0</div>';
    container.appendChild(box);
    const cv = box.querySelector('canvas');
    const ctx = cv.getContext('2d');
    const scoreEl = box.querySelector('.snake-score');
    const styles = getComputedStyle(document.documentElement);
    const acc = styles.getPropertyValue('--accent').trim() || '#c25f3f';
    const ink = styles.getPropertyValue('--text').trim() || '#26241f';
    const border = styles.getPropertyValue('--border').trim() || '#e7e3d8';
    const G = 18, CELL = 20;
    let snake, dir, food, score, alive, started, timer, best = U.store.get('blog.snakeBest', 0);
    const reset = () => {
      snake = [{ x: 9, y: 9 }, { x: 8, y: 9 }, { x: 7, y: 9 }];
      dir = { x: 1, y: 0 }; food = spawn(); score = 0; alive = true; started = false;
      render();
    };
    const spawn = () => {
      let f;
      do { f = { x: Math.floor(Math.random() * G), y: Math.floor(Math.random() * G) }; }
      while (snake && snake.some(s => s.x === f.x && s.y === f.y));
      return f;
    };
    const render = () => {
      ctx.fillStyle = styles.getPropertyValue('--card').trim() || '#fff';
      ctx.fillRect(0, 0, 360, 360);
      ctx.strokeStyle = border; ctx.lineWidth = 1;
      for (let i = 0; i <= G; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 360); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(360, i * CELL); ctx.stroke();
      }
      ctx.fillStyle = acc;
      ctx.fillRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6);
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? ink : acc;
        ctx.globalAlpha = i === 0 ? 1 : Math.max(.35, 1 - i * .04);
        ctx.fillRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4);
      });
      ctx.globalAlpha = 1;
      scoreEl.textContent = '得分 ' + score + ' · 最高 ' + best + (started ? '' : ' · 按空格开始');
    };
    const step = () => {
      if (!alive || !started) return;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.y < 0 || head.x >= G || head.y >= G || snake.some(s => s.x === head.x && s.y === head.y)) {
        alive = false;
        if (score > best) { best = score; U.store.set('blog.snakeBest', best); }
        render();
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) { score += 10; food = spawn(); }
      else snake.pop();
      render();
    };
    this.onKey = (e) => {
      const arrows = { ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 } };
      if (e.key === ' ') {
        e.preventDefault();
        if (!alive || !started) { reset(); started = true; }
        return;
      }
      if (arrows[e.key]) {
        e.preventDefault();
        const nd = arrows[e.key];
        if (!started) { reset(); started = true; }
        if (nd.x !== -dir.x || nd.y !== -dir.y) dir = nd;
      }
    };
    document.addEventListener('keydown', this.onKey);
    timer = setInterval(step, 130);
    reset();
    this.running = true;
    this._stop = () => {
      clearInterval(timer);
      document.removeEventListener('keydown', this.onKey);
      box.remove();
      this.running = false;
    };
  },
  stop() { if (this._stop) this._stop(); }
};

/* ---------- G 键组合快速导航 ---------- */
const GNav = {
  pending: false, timer: null,
  MAP: { h: '#/', a: '#/archive', t: '#/tags', s: '#/shelf', p: '#/album', m: '#/timeline', g: '#/guestbook', l: '#/links', b: '#/about', o: '#/hot', f: '#/favs' },
  NAMES: { h: '首页', a: '归档', t: '标签', s: '书影音', p: '相册', m: '时间线', g: '留言板', l: '友链', b: '关于', o: '热门', f: '收藏' },
  init() {
    const bar = document.createElement('div');
    bar.className = 'gnav-bar';
    bar.id = 'gnavBar';
    bar.textContent = 'G 导航：';
    document.body.appendChild(bar);
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
      if (e.target && typeof e.target.matches === 'function' && e.target.matches('input, textarea')) return;
      const k = e.key.toLowerCase();
      if (!this.pending) {
        if (k === 'g') {
          this.pending = true;
          clearTimeout(this.timer);
          this.timer = setTimeout(() => this.clear(), 2200);
          bar.textContent = 'G 导航：' + Object.entries(this.NAMES).map(([kk, v]) => kk + '=' + v).join('  ');
          bar.classList.add('show');
        }
        return;
      }
      // pending 态
      e.preventDefault();
      this.clear();
      if (this.MAP[k]) Router.go(this.MAP[k]);
      else if (k === 'r') randomPost();
    });
  },
  clear() {
    this.pending = false;
    clearTimeout(this.timer);
    const bar = document.getElementById('gnavBar');
    if (bar) bar.classList.remove('show');
  }
};

/* ---------- 主题四时段自动换 ---------- */
const AutoTheme = {
  SEGMENTS: [[6, 11, 'fresh'], [11, 17, 'opus'], [17, 21, 'amber'], [21, 6, 'night']],
  NAMES: { fresh: '清晨·清新蓝白', opus: '日间·纸墨', amber: '黄昏·琥珀', night: '夜晚·暗夜' },
  current() {
    const h = new Date().getHours();
    for (const [a, b, t] of this.SEGMENTS) {
      if (a < b ? (h >= a && h < b) : (h >= a || h < b)) return t;
    }
    return 'opus';
  },
  tick() {
    if (!SITE.autoTheme || U.store.get('blog.themeManual', false)) return;
    const target = this.current();
    if (document.documentElement.getAttribute('data-theme') !== target) {
      Theme.applyTheme(target, { silent: true });
      U.toast('🌗 ' + (this.NAMES[target] || target));
    }
  },
  start() {
    if (!SITE.autoTheme) return;
    this.tick();
    setInterval(() => this.tick(), 30 * 60 * 1000);
  }
};
