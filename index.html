<!DOCTYPE html>
<html lang="zh-CN" data-theme="fresh" data-mode="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>拾光小筑</title>
<meta name="description" id="metaDesc" content="记录、分享、成长 —— 一个喜欢折腾的普通人" />
<meta name="theme-color" id="metaTheme" content="#3b82f6" />
<meta property="og:title" id="ogTitle" content="拾光小筑" />
<meta property="og:description" id="ogDesc" content="记录、分享、成长 —— 一个喜欢折腾的普通人" />
<meta property="og:type" content="website" />
<meta property="og:image" id="ogImage" content="" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E" />
<style>
/* ============================================================
 * 访客站样式 — 5 主题 + 深浅模式 + 全组件
 * ============================================================ */

/* ---------- 主题变量 ---------- */
:root {
  --radius: 14px;
  --radius-sm: 9px;
  --nav-h: 58px;
  --page-w: 1080px;
  --font-body: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-serif: Georgia, "Noto Serif SC", "Songti SC", SimSun, serif;
  --font-round: "Yuanti SC", "Microsoft YaHei UI", system-ui, sans-serif;
  --line: 1.75;
  --fs: 16px;
  --trans: 0.18s cubic-bezier(.4,0,.2,1);
}

/* 主题：清新蓝白（默认） */
html[data-theme="fresh"] {
  --bg: #f4f7fb; --bg2: #eaf1f9; --card: #ffffff;
  --text: #22303f; --text2: #51606f; --muted: #8b99a8;
  --border: #e3eaf2; --accent: #3b82f6; --accent2: #6366f1;
  --accent-soft: rgba(59,130,246,.1); --accent-grad: linear-gradient(135deg,#3b82f6,#6366f1);
  --shadow: 0 2px 16px rgba(30,60,120,.07);
  --header-bg: rgba(255,255,255,.82);
}
/* 主题：暗夜 */
html[data-theme="night"] {
  --bg: #0d1117; --bg2: #10161f; --card: #161d27;
  --text: #dbe4ee; --text2: #97a5b5; --muted: #5d6b7b;
  --border: #232d3a; --accent: #4f9cf9; --accent2: #7c6df2;
  --accent-soft: rgba(79,156,249,.14); --accent-grad: linear-gradient(135deg,#4f9cf9,#7c6df2);
  --shadow: 0 2px 18px rgba(0,0,0,.4);
  --header-bg: rgba(13,17,23,.85);
}
/* 主题：樱花粉 */
html[data-theme="sakura"] {
  --bg: #fdf5f7; --bg2: #faeaf0; --card: #ffffff;
  --text: #402c35; --text2: #6f5560; --muted: #ab8e9a;
  --border: #f3dfe6; --accent: #ec6a9c; --accent2: #f09ac1;
  --accent-soft: rgba(236,106,156,.1); --accent-grad: linear-gradient(135deg,#ec6a9c,#f09ac1);
  --shadow: 0 2px 16px rgba(180,80,120,.09);
  --header-bg: rgba(255,248,250,.85);
}
/* 主题：抹茶绿 */
html[data-theme="matcha"] {
  --bg: #f3f7f1; --bg2: #e7f0e3; --card: #ffffff;
  --text: #2c3830; --text2: #55685c; --muted: #8ba093;
  --border: #dfe9db; --accent: #3f9d63; --accent2: #6db98a;
  --accent-soft: rgba(63,157,99,.1); --accent-grad: linear-gradient(135deg,#3f9d63,#6db98a);
  --shadow: 0 2px 16px rgba(40,100,60,.08);
  --header-bg: rgba(250,253,249,.85);
}
/* 主题：暗紫科技 */
html[data-theme="tech"] {
  --bg: #0f0c1d; --bg2: #141026; --card: #1a1530;
  --text: #e2dcf5; --text2: #a89fd0; --muted: #6c6390;
  --border: #2a2347; --accent: #a78bfa; --accent2: #22d3ee;
  --accent-soft: rgba(167,139,250,.14); --accent-grad: linear-gradient(135deg,#a78bfa,#22d3ee);
  --shadow: 0 2px 20px rgba(80,40,180,.25);
  --header-bg: rgba(15,12,29,.85);
}

/* 用户自定义主题色覆盖 */
html[data-accent] { --accent: var(--user-accent); }

/* ---------- 基础 ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + 12px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: var(--fs); line-height: var(--line);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  transition: background .25s, color .25s;
}
html[data-font="serif"] body { font-family: var(--font-serif); }
html[data-font="round"] body { font-family: var(--font-round); }
html[data-density="compact"] { --radius: 10px; --page-w: 1200px; }
html[data-density="loose"] { --radius: 18px; --page-w: 920px; }
a { color: var(--accent); text-decoration: none; transition: color var(--trans); }
a:hover { filter: brightness(1.12); }
img { max-width: 100%; }
button { font-family: inherit; cursor: pointer; }
::selection { background: var(--accent-soft); color: var(--accent); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
.container { max-width: var(--page-w); margin: 0 auto; padding: 0 20px; }

/* ---------- 顶栏 ---------- */
.progress-bar { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent-grad); z-index: 1002; transition: width .08s linear; }
.site-header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); z-index: 1000;
  background: var(--header-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  transition: transform .25s, background .25s;
}
.site-header.hide { transform: translateY(-100%); }
.header-inner { max-width: var(--page-w); margin: 0 auto; padding: 0 20px; height: 100%; display: flex; align-items: center; gap: 18px; }
.logo { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 700; font-size: 17px; flex-shrink: 0; min-width: 0; }
.logo img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
.logo .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent-grad); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
.logo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.main-nav { display: flex; gap: 4px; flex: 1; justify-content: center; overflow-x: auto; scrollbar-width: none; }
.main-nav::-webkit-scrollbar { display: none; }
.main-nav a { color: var(--text2); padding: 6px 13px; border-radius: 8px; font-size: 14.5px; white-space: nowrap; transition: all var(--trans); }
.main-nav a:hover { color: var(--accent); background: var(--accent-soft); }
.main-nav a.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.header-actions { display: flex; gap: 4px; flex-shrink: 0; }
.icon-btn { width: 34px; height: 34px; border: none; background: transparent; border-radius: 9px; color: var(--text2); font-size: 17px; display: inline-flex; align-items: center; justify-content: center; transition: all var(--trans); }
.icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
.hamburger { display: none; }
.mobile-nav { display: flex; flex-direction: column; padding: 8px 14px 12px; border-top: 1px solid var(--border); }
.mobile-nav a { padding: 10px 12px; color: var(--text2); border-radius: 8px; }
.mobile-nav a.active { color: var(--accent); background: var(--accent-soft); }

/* ---------- 主视图 ---------- */
.view { min-height: calc(100vh - var(--nav-h)); padding-top: var(--nav-h); outline: none; }
.page { padding: 26px 0 60px; animation: pageIn .28s ease both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.page-title { font-size: 24px; margin: 6px 0 20px; display: flex; align-items: center; gap: 10px; }
.page-title .pt-icon { font-size: 22px; }

/* ---------- 首页 Hero ---------- */
.hero { padding: 44px 0 30px; display: flex; align-items: center; gap: 22px; }
.hero-avatar { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 3px solid var(--card); box-shadow: var(--shadow); }
.hero-mark { width: 84px; height: 84px; border-radius: 26px; background: var(--accent-grad); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 800; box-shadow: var(--shadow); }
.hero-info h1 { margin: 0 0 6px; font-size: 26px; }
.hero-info p { margin: 0; color: var(--text2); font-size: 14.5px; }
.hero-meta { display: flex; gap: 14px; margin-top: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.hero-meta b { color: var(--accent); }
.greet-line { color: var(--muted); font-size: 13.5px; margin-top: 8px; }

/* ---------- 信息流卡片 ---------- */
.feed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.post-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
  transition: transform var(--trans), box-shadow var(--trans), border-color var(--trans);
  content-visibility: auto; contain-intrinsic-size: auto 240px;
  animation: cardIn .3s ease both;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.post-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(20,40,80,.13); border-color: var(--accent); }
.post-card .pc-cover { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--bg2); display: block; }
.pc-body { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.pc-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.badge.pin { background: linear-gradient(135deg,#f59e0b,#f97316); color: #fff; }
.badge.type { background: var(--bg2); color: var(--text2); font-weight: 500; }
.pc-title { margin: 0; font-size: 16.5px; line-height: 1.4; }
.pc-title a { color: var(--text); }
.pc-title a:hover { color: var(--accent); }
.pc-excerpt { margin: 0; color: var(--text2); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pc-quote { font-family: var(--font-serif); font-size: 15px; color: var(--text2); font-style: italic; }
.pc-foot { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12.5px; margin-top: auto; padding-top: 4px; }
.pc-foot .spacer { flex: 1; }
.pc-foot .pf-item { display: inline-flex; align-items: center; gap: 4px; }
.pc-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.pc-tags a { font-size: 12px; color: var(--text2); background: var(--bg2); padding: 2px 9px; border-radius: 14px; }
.pc-tags a:hover { color: var(--accent); background: var(--accent-soft); }
.pc-imgs { display: grid; gap: 4px; margin: 4px 0; }
.pc-imgs.n1 { grid-template-columns: 1fr; }
.pc-imgs.n2, .pc-imgs.n4 { grid-template-columns: 1fr 1fr; }
.pc-imgs.n3 { grid-template-columns: 1fr 1fr 1fr; }
.pc-imgs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--bg2); }
.pc-video, .pc-music, .pc-linkcard { margin: 2px 0 4px; }
.feed-more { text-align: center; padding: 26px 0 6px; color: var(--muted); font-size: 13.5px; }
.feed-sentinel { height: 2px; }

/* ---------- 文章详情 ---------- */
.post-wrap { max-width: 780px; margin: 0 auto; padding: 30px 20px 70px; }
.post-head { margin-bottom: 22px; }
.post-head h1 { font-size: 28px; line-height: 1.35; margin: 10px 0 12px; }
.post-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.post-meta .pm { display: inline-flex; align-items: center; gap: 5px; }
.post-cover { width: 100%; border-radius: var(--radius); margin: 16px 0; box-shadow: var(--shadow); }
.post-tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 0; }
.post-tags a { font-size: 12.5px; background: var(--bg2); color: var(--text2); padding: 3px 11px; border-radius: 15px; }
.post-tags a:hover { background: var(--accent-soft); color: var(--accent); }
.post-toc {
  position: fixed; right: max(16px, calc((100vw - 1400px) / 2)); top: 50%; transform: translateY(-50%);
  width: 210px; max-height: 66vh; overflow-y: auto; padding: 12px 8px 12px 14px;
  border-left: 2px solid var(--border); font-size: 12.8px; z-index: 50;
  scrollbar-width: thin; display: none;
}
.post-toc .toc-title { font-weight: 700; color: var(--muted); font-size: 11.5px; letter-spacing: 1px; margin-bottom: 6px; }
.post-toc a { display: block; color: var(--muted); padding: 3px 0 3px 8px; border-left: 2px solid transparent; margin-left: -15px; transition: all var(--trans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.post-toc a.l2 { padding-left: 20px; }
.post-toc a.l3 { padding-left: 32px; }
.post-toc a:hover { color: var(--accent); }
.post-toc a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
@media (min-width: 1420px) { .post-toc { display: block; } }

/* Markdown 正文 */
.md { font-size: calc(var(--fs) + 0.5px); line-height: calc(var(--line) + 0.05); word-break: break-word; }
html[data-reading="on"] .md { font-size: calc(var(--fs) + 2.5px); letter-spacing: .3px; }
.md p { margin: 0 0 1em; }
.md h2, .md h3, .md h4, .md h5 { margin: 1.6em 0 .7em; line-height: 1.4; }
.md h2 { font-size: 1.45em; padding-left: 10px; border-left: 4px solid var(--accent); }
.md h3 { font-size: 1.22em; }
.md h4 { font-size: 1.08em; }
.md img { border-radius: var(--radius-sm); cursor: zoom-in; box-shadow: var(--shadow); }
.md blockquote { margin: 1.1em 0; padding: 10px 16px; background: var(--bg2); border-left: 4px solid var(--accent); border-radius: 0 10px 10px 0; color: var(--text2); }
.md blockquote p:last-child { margin-bottom: 0; }
.md code.md-icode { background: var(--accent-soft); color: var(--accent); padding: 2px 7px; border-radius: 6px; font-size: .88em; font-family: ui-monospace, Consolas, monospace; }
.md pre { position: relative; background: #0f172a; color: #e2e8f0; padding: 40px 16px 14px; border-radius: 12px; overflow-x: auto; font-size: 13.5px; line-height: 1.6; margin: 1.2em 0; }
html[data-mode="dark"] .md pre, html[data-theme="night"] .md pre, html[data-theme="tech"] .md pre { background: #0a0e1a; }
.md pre .code-lang { position: absolute; top: 0; left: 14px; font-size: 11px; color: #64748b; letter-spacing: 1px; line-height: 26px; text-transform: uppercase; }
.md pre .code-copy { position: absolute; top: 5px; right: 8px; background: rgba(255,255,255,.08); border: none; color: #94a3b8; font-size: 11.5px; padding: 3px 10px; border-radius: 6px; transition: all .2s; }
.md pre .code-copy:hover { background: var(--accent); color: #fff; }
.md pre .code-copy.ok { background: #10b981; color: #fff; }
.md pre code { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
.hl-com { color: #6a737d; font-style: italic; }
.hl-str { color: #7ee787; }
.hl-num { color: #f2cc60; }
.hl-kw { color: #ff7b72; }
.hl-fn { color: #d2a8ff; }
.hl-type { color: #79c0ff; }
.hl-pn { color: #8b949e; }
.hl-attr { color: #7ee787; }
.md table { border-collapse: collapse; width: 100%; margin: 1.2em 0; font-size: .92em; }
.md-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
.md th, .md td { padding: 9px 13px; border-bottom: 1px solid var(--border); }
.md th { background: var(--bg2); font-weight: 600; white-space: nowrap; }
.md tbody tr:nth-child(even) { background: var(--bg2); opacity: .6; }
.md tbody tr:last-child td { border-bottom: none; }
.md hr { border: none; border-top: 1px dashed var(--border); margin: 2em 0; }
.md ul, .md ol { padding-left: 1.6em; margin: .6em 0 1em; }
.md li { margin: .3em 0; }
.md li.md-task-item { list-style: none; margin-left: -1.4em; }
.md li.md-task-item input { accent-color: var(--accent); margin-right: 7px; transform: translateY(1px); }
.md li.md-task-item input:checked + * { text-decoration: line-through; opacity: .55; }
.md .md-footnotes { font-size: .85em; color: var(--text2); }
.md sup.md-fnref a, .md sup.md-fnref { color: var(--accent); cursor: pointer; }
.md mark { background: linear-gradient(120deg, rgba(245,158,11,.4), rgba(245,158,11,.15)); color: inherit; padding: 0 3px; border-radius: 4px; }
.md a { border-bottom: 1px dashed var(--accent); }
/* 数学公式 */
.math-inline-c { font-family: "Times New Roman", serif; font-style: italic; }
.math-display { display: block; text-align: center; margin: 1.2em 0; font-size: 1.1em; font-family: "Times New Roman", serif; }
.math-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 3px; }
.math-frac .math-num { border-bottom: 1px solid currentColor; padding: 0 4px; }
.math-frac .math-den { padding: 0 4px; }
.math-sqrt { display: inline-flex; align-items: stretch; }
.math-sqrt-body { border-top: 1px solid currentColor; padding: 0 3px; }
.math-big { font-size: 1.3em; margin: 0 2px; }
.math-text { font-style: normal; font-size: .92em; }
.math-bb { font-style: normal; font-weight: 700; }
.math-gap { display: inline-block; width: 1.5em; }
/* Mermaid */
.md-mermaid { margin: 1.2em 0; text-align: center; }
.mermaid-svg .mermaid-node rect, .mermaid-svg .mermaid-node polygon, .mermaid-svg .mermaid-node circle { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
.mermaid-svg text { fill: var(--text); font-size: 13px; font-family: var(--font-body); }
.mermaid-svg .mermaid-edge { stroke: var(--muted); stroke-width: 1.6; }
.mermaid-svg .mermaid-label { font-size: 12px; fill: var(--text2); }

/* 文章操作条 */
.post-actions { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 34px 0 10px; }
.action-btn {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border);
  background: var(--card); color: var(--text2); padding: 9px 20px; border-radius: 24px;
  font-size: 14px; transition: all var(--trans); box-shadow: var(--shadow);
}
.action-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
.action-btn.liked { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.action-btn .heart { transition: transform .2s; }
.action-btn.liked .heart { transform: scale(1.15); }
.copyright-box { margin-top: 26px; padding: 14px 18px; background: var(--bg2); border-radius: var(--radius-sm); color: var(--muted); font-size: 13px; line-height: 1.8; }
.copyright-box a { color: var(--accent); }
.post-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 26px; }
.post-nav a { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 16px; color: var(--text2); font-size: 13.5px; transition: all var(--trans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.post-nav a:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
.post-nav a small { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 3px; }
.post-nav a.next { text-align: right; }
.related h3 { font-size: 16px; margin: 34px 0 14px; }

/* 密码保护 */
.protect-box { text-align: center; padding: 60px 20px; }
.protect-box .lock-icon { font-size: 44px; }
.protect-box input { margin: 18px 0; padding: 10px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); font-size: 15px; width: 240px; outline: none; }
.protect-box input:focus { border-color: var(--accent); }

/* ---------- 评论 ---------- */
.comments { margin-top: 40px; }
.comments h3 { font-size: 17px; display: flex; align-items: center; gap: 8px; }
.comment-form { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin: 14px 0 22px; }
.comment-form textarea { width: 100%; min-height: 84px; border: none; resize: vertical; background: transparent; color: var(--text); font-family: inherit; font-size: 14px; outline: none; }
.comment-form-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.comment-form input.cf-name { padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); color: var(--text); font-size: 13px; width: 140px; outline: none; }
.btn { border: none; border-radius: 9px; padding: 8px 18px; font-size: 13.5px; font-weight: 600; transition: all var(--trans); display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent-grad); color: #fff; }

/* ---------- 相册/书影歌/清单 ---------- */
.album-grid { columns: 4 220px; column-gap: 12px; }

.music-row:hover { border-color: var(--accent); }
.music-row .m-cover { width: 46px; height: 46px; border-radius: 9px; object-fit: cover; background: var(--accent-grad); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }

.daily-quote { background: var(--accent-grad); color: #fff; border-radius: var(--radius); padding: 26px 30px; margin: 10px 0 26px; box-shadow: var(--shadow); position: relative; overflow: hidden; }

.friend-card { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; transition: all var(--trans); }
.friend-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.friend-card .f-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--accent-grad); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px; flex-shrink: 0; }
.friend-card .f-name { font-weight: 700; font-size: 14.5px; }

.about-page .md { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px 34px; box-shadow: var(--shadow); }

/* ---------- 命令面板 ---------- */
.overlay { position: fixed; inset: 0; z-index: 1100; background: rgba(10,15,25,.5); backdrop-filter: blur(4px); display: flex; align-items: flex-start; justify-content: center; padding: 12vh 20px 20px; animation: fadeIn .15s ease; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.cmdk-box { width: 620px; max-width: 100%; background: var(--card); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden; border: 1px solid var(--border); animation: popIn .18s ease; }
@keyframes popIn { from { opacity: 0; transform: scale(.96) translateY(-8px); } to { opacity: 1; transform: none; } }
.cmdk-input-row { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.cmdk-icon { color: var(--muted); font-size: 18px; }
.cmdk-input-row input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-size: 16px; font-family: inherit; }
.cmdk-input-row kbd { font-size: 11px; background: var(--bg2); padding: 3px 7px; border-radius: 5px; color: var(--muted); }
.cmdk-hist { padding: 8px 14px 0; display: flex; gap: 6px; flex-wrap: wrap; }
.cmdk-hist .hist-item { font-size: 12px; background: var(--bg2); color: var(--text2); border-radius: 12px; padding: 3px 11px; cursor: pointer; }
.cmdk-hist .hist-item:hover { color: var(--accent); }
.cmdk-results { max-height: 52vh; overflow-y: auto; padding: 8px; }
.cmdk-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: background .12s; }
.cmdk-item:hover, .cmdk-item.active { background: var(--accent-soft); }
.cmdk-item .ci-icon { width: 34px; height: 34px; border-radius: 9px; background: var(--bg2); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.cmdk-item .ci-main { flex: 1; min-width: 0; }
.cmdk-item .ci-title { font-size: 14px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdk-item .ci-title mark { background: none; color: var(--accent); font-weight: 700; }
.cmdk-item .ci-sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdk-item .ci-kbd { font-size: 11px; color: var(--muted); }
.cmdk-empty { text-align: center; color: var(--muted); padding: 34px 0; font-size: 13.5px; }

/* ---------- 灯箱 ---------- */
.lightbox { align-items: center; padding: 30px; background: rgba(5,8,14,.92); }
.lightbox .lb-stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; height: 100%; }
.lightbox img { max-width: 92%; max-height: 88vh; transition: transform .15s; will-change: transform; border-radius: 6px; }
.lb-close { position: fixed; top: 18px; right: 22px; width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,.1); color: #fff; font-size: 21px; }
.lb-close:hover { background: rgba(255,255,255,.22); }
.lb-nav { position: fixed; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,.08); color: #fff; font-size: 25px; }
.lb-nav:hover { background: var(--accent); }
.lb-prev { left: 16px; }
.lb-next { right: 16px; }
.lb-toolbar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.09); backdrop-filter: blur(8px); border-radius: 22px; padding: 5px 12px; }
.lb-toolbar button { border: none; background: transparent; color: #cbd5e1; font-size: 17px; width: 34px; height: 30px; border-radius: 8px; }
.lb-toolbar button:hover { background: rgba(255,255,255,.15); color: #fff; }
.lb-count { color: #94a3b8; font-size: 12px; margin-left: 6px; }

/* ---------- 确认框/分享 ---------- */
.confirm-box { width: 420px; max-width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; text-align: center; animation: popIn .18s ease; }
.confirm-box h3 { margin: 0 0 10px; }
.confirm-url { background: var(--bg2); border-radius: 9px; padding: 9px 12px; font-size: 12.5px; color: var(--text2); word-break: break-all; }
.confirm-tip { color: var(--muted); font-size: 12.5px; }
.confirm-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
.share-box .qr-wrap { display: flex; justify-content: center; margin: 14px 0; color: var(--text); }
.share-box .qr-wrap svg { background: #fff; border-radius: 10px; padding: 8px; }
.share-url { font-size: 12px; color: var(--muted); word-break: break-all; margin: 8px 0 12px; }
.share-socials { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.share-socials a { font-size: 12.5px; padding: 6px 14px; border-radius: 16px; background: var(--bg2); color: var(--text2); }
.share-socials a:hover { background: var(--accent-soft); color: var(--accent); }

/* ---------- 播放器条 ---------- */
.player-bar {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
  width: min(560px, calc(100vw - 32px)); height: 54px; z-index: 1050;
  background: var(--card); border: 1px solid var(--border); border-radius: 27px;
  box-shadow: 0 8px 30px rgba(0,0,0,.18); display: flex; align-items: center; gap: 12px; padding: 0 14px;
  animation: pbIn .3s ease;
}
@keyframes pbIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
.pb-toggle { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--accent-grad); color: #fff; font-size: 14px; flex-shrink: 0; }
.pb-info { flex: 1; min-width: 0; }
.pb-info span { font-size: 13px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pb-progress { height: 3px; background: var(--bg2); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.pb-progress div { height: 100%; width: 0; background: var(--accent-grad); transition: width .2s linear; }
.pb-list { border: none; background: transparent; color: var(--text2); font-size: 17px; }
.pb-playlist { position: absolute; bottom: 62px; right: 0; width: 300px; max-height: 320px; overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 8px; }
.pb-playlist .pbp-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; cursor: pointer; font-size: 13.5px; }
.pb-playlist .pbp-item:hover, .pb-playlist .pbp-item.playing { background: var(--accent-soft); color: var(--accent); }
.pb-playlist .pbp-sub { color: var(--muted); font-size: 11.5px; margin-left: auto; }

/* ---------- 公告 ---------- */
.announce-bar { position: fixed; top: var(--nav-h); left: 50%; transform: translateX(-50%); z-index: 999; background: var(--accent-grad); color: #fff; border-radius: 0 0 12px 12px; padding: 7px 16px; font-size: 13px; display: flex; align-items: center; gap: 8px; max-width: 92vw; box-shadow: var(--shadow); }
.announce-bar[hidden] { display: none; }
.announce-close { border: none; background: transparent; color: #fff; font-size: 15px; opacity: .8; }
.announce-close:hover { opacity: 1; }

/* ---------- 返回顶部 ---------- */
.back-top, .back-bottom { position: fixed; right: 22px; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text2); font-size: 16px; z-index: 900; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: all var(--trans); }
.back-top { bottom: 74px; }
.back-bottom { bottom: 26px; }
.back-top.show, .back-bottom.show { opacity: 1; pointer-events: auto; }
.back-top:hover, .back-bottom:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-2px); }

/* ---------- 特效层 ---------- */
#effectsLayer { position: fixed; inset: 0; pointer-events: none; z-index: 950; overflow: hidden; }
.effect-fall { position: absolute; top: -30px; will-change: transform; animation: fallDown linear forwards; }
@keyframes fallDown { to { transform: translateY(110vh) rotate(340deg); } }
.effect-click { position: absolute; font-size: 15px; pointer-events: none; animation: clickPop .8s ease forwards; will-change: transform, opacity; }
@keyframes clickPop { 0% { opacity: 1; transform: translateY(0) scale(.6); } 100% { opacity: 0; transform: translateY(-46px) scale(1.3); } }

/* ---------- 页脚 ---------- */
.site-footer { border-top: 1px solid var(--border); background: var(--card); padding: 26px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 2; }
.site-footer a { color: var(--text2); }
.site-footer a:hover { color: var(--accent); }

/* ---------- 打印 ---------- */
@media print {
  .site-header, .site-footer, .post-actions, .comments, .post-toc, .back-top, .back-bottom, .player-bar, .announce-bar, #progressBar, .post-nav, .related { display: none !important; }
  body { background: #fff; color: #000; }
  .view { padding-top: 0; }
  .md pre { white-space: pre-wrap; background: #f5f5f5 !important; color: #111 !important; }
}

/* ---------- 响应式 ---------- */
@media (max-width: 860px) {
  .main-nav { display: none; }
  .hamburger { display: inline-flex; }
  .hero { padding: 30px 0 22px; }
  .hero-avatar, .hero-mark { width: 64px; height: 64px; }
  .hero-info h1 { font-size: 21px; }
  .feed-grid { grid-template-columns: 1fr; }
  .post-head h1 { font-size: 22.5px; }
  .post-wrap { padding: 20px 16px 60px; }
  .page { padding: 18px 0 50px; }
  .post-nav { grid-template-columns: 1fr; }
  .album-grid { columns: 2 150px; }
  .shelf-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .player-bar { bottom: 12px; }
  .back-top { bottom: 66px; right: 14px; }
  .back-bottom { bottom: 18px; right: 14px; }
  .about-page .md { padding: 20px; }
}

/* ---------- 无障碍 ---------- */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

  --border: #3a2f1f; --accent: #f59e0b; --accent2: #f97316;
  --accent-soft: rgba(245,158,11,.13); --accent-grad: linear-gradient(135deg,#f59e0b,#f97316);
  --shadow: 0 2px 20px rgba(0,0,0,.4);
  --header-bg: rgba(23,18,12,.86);
}

/* ---------- 背景装饰层 ---------- */
.bg-deco { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg-deco i {
  position: absolute; width: 520px; height: 520px; border-radius: 50%;
  filter: blur(90px); opacity: 0; transition: opacity 1s;
  will-change: transform;
}
html[data-bgdeco="aurora"] .bg-deco i { opacity: .32; }
html[data-bgdeco="aurora"] .bg-deco i:nth-child(1) { background: var(--accent); top: -180px; left: -120px; animation: blobFloat 22s ease-in-out infinite alternate; }
html[data-bgdeco="aurora"] .bg-deco i:nth-child(2) { background: var(--accent2); bottom: -200px; right: -140px; animation: blobFloat 26s ease-in-out infinite alternate-reverse; }
html[data-bgdeco="aurora"] .bg-deco i:nth-child(3) { background: var(--accent); top: 38%; left: 56%; width: 360px; height: 360px; opacity: .18; animation: blobFloat 30s ease-in-out infinite alternate; }
@keyframes blobFloat {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(60px, 40px) scale(1.12); }
  100% { transform: translate(-40px, 70px) scale(.94); }
}
.bg-grid, .bg-stars { display: none; }
html[data-bgdeco="grid"] .bg-grid {
  display: block; position: absolute; inset: 0; opacity: .5;
  background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 75%);
          mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 75%);
}
html[data-bgdeco="stars"] .bg-stars {
  display: block; position: absolute; inset: 0; opacity: .5;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 22%, var(--muted) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 34% 8%, var(--muted) 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 58% 30%, var(--muted) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 76% 12%, var(--muted) 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 90% 40%, var(--muted) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 22% 55%, var(--muted) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 66% 70%, var(--muted) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 44% 84%, var(--muted) 50%, transparent 51%);
  background-size: 100% 100%;
  animation: twinkle 5s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: .3; } to { opacity: .6; } }

/* ---------- 鼠标光晕 ---------- */
#spotlight {
  position: fixed; width: 560px; height: 560px; border-radius: 50%;
  pointer-events: none; z-index: 0; opacity: 0; transition: opacity .4s;
  background: radial-gradient(circle, var(--accent-soft) 0%, transparent 62%);
  transform: translate(-50%, -50%); will-change: left, top;
}
html[data-spotlight="on"] #spotlight { opacity: 1; }

/* ---------- 顶栏升级 ---------- */
.site-header.scrolled { box-shadow: 0 4px 24px rgba(10, 20, 40, .08); }
.main-nav a { position: relative; }
.main-nav a::after {
  content: ''; position: absolute; left: 50%; bottom: 2px; height: 2px; width: 0;
  border-radius: 2px; background: var(--accent-grad);
  transition: width .25s cubic-bezier(.34,1.4,.64,1), left .25s;
}
.main-nav a:hover::after, .main-nav a.active::after { width: calc(100% - 22px); left: 11px; }

/* ---------- Hero 升级 ---------- */
.hero { padding: 52px 0 34px; position: relative; }
.hero-info h1 {
  font-size: 34px; letter-spacing: .5px; margin: 0 0 8px;
  background: linear-gradient(120deg, var(--text) 30%, var(--accent) 75%, var(--accent2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero-typing { min-height: 1.6em; font-size: 15px; color: var(--text2); }
.hero-typing .tw-caret {
  display: inline-block; width: 2px; height: 1.05em; background: var(--accent);
  margin-left: 2px; vertical-align: -2px; animation: caretBlink 1s steps(1) infinite;
}
@keyframes caretBlink { 50% { opacity: 0; } }
.hero-socials { display: flex; gap: 8px; margin-top: 12px; }
.hero-socials a {
  width: 34px; height: 34px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center;
  background: var(--card); border: 1px solid var(--border); color: var(--text2);
  font-size: 15px; box-shadow: var(--shadow); transition: all var(--trans);
}
.hero-socials a:hover { transform: translateY(-3px) rotate(-4deg); color: var(--accent); border-color: var(--accent); }
.hero-meta b { font-variant-numeric: tabular-nums; }
.continue-strip { margin: 4px 0 20px; }
.continue-strip .cs-title { font-size: 12.5px; color: var(--muted); letter-spacing: 1px; margin-bottom: 8px; }
.cs-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.cs-row::-webkit-scrollbar { display: none; }
.cs-card {
  flex: 0 0 240px; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px; box-shadow: var(--shadow); transition: all var(--trans);
}
.cs-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.cs-card .cst { font-size: 13.5px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 7px; }
.cs-card .cs-bar { height: 4px; background: var(--bg2); border-radius: 3px; overflow: hidden; }
.cs-card .cs-bar i { display: block; height: 100%; background: var(--accent-grad); border-radius: 3px; }
.cs-card .cs-pct { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* ---------- 卡片 3D 倾斜 + 光泽 + 交错入场 ---------- */
.feed-grid { perspective: 1200px; }
.post-card { position: relative; transform-style: preserve-3d; will-change: transform; }
.post-card.tilting { transition: transform .08s linear, box-shadow var(--trans), border-color var(--trans); }
.pc-glare {
  position: absolute; inset: 0; border-radius: var(--radius); pointer-events: none; opacity: 0;
  background: radial-gradient(420px circle at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,.16), transparent 42%);
  transition: opacity .25s; z-index: 2;
}
.post-card:hover .pc-glare { opacity: 1; }
.feed-grid .post-card { animation: cardIn .5s cubic-bezier(.22,.9,.34,1) both; animation-delay: calc(var(--stagger, 0) * 55ms); }
.pc-coverwrap { position: relative; overflow: hidden; }
.pc-coverwrap .pc-cover { display: block; }
.pc-coverwrap .pc-covergrad {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, transparent 55%, rgba(10, 18, 32, .38));
}
.pc-coverwrap .pc-coverbadge {
  position: absolute; right: 10px; bottom: 10px; font-size: 11px; color: #fff;
  background: rgba(15, 25, 40, .5); backdrop-filter: blur(6px); padding: 3px 10px; border-radius: 14px;
}
/* 图片 shimmer 加载态 */
.pc-cover, .md-img, .album-item img, .shelf-cover, .m-thumb img {
  background: linear-gradient(110deg, var(--bg2) 30%, var(--border) 42%, var(--bg2) 55%);
  background-size: 220% 100%; animation: shimmer 1.6s linear infinite;
}
img.img-done { animation: none; background: none; }
@keyframes shimmer { to { background-position: -220% 0; } }

/* ---------- 返回顶部 · 进度环 ---------- */
.back-top { overflow: visible; }
.back-top svg { position: absolute; inset: -5px; width: 50px; height: 50px; transform: rotate(-90deg); pointer-events: none; }
.back-top .rt-track { fill: none; stroke: var(--border); stroke-width: 3; }
.back-top .rt-bar {
  fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round;
  stroke-dasharray: 119.4; stroke-dashoffset: 119.4; transition: stroke-dashoffset .1s linear;
}

/* ---------- 播放器频谱 ---------- */
.pb-spec { display: flex; align-items: flex-end; gap: 2.5px; height: 16px; width: 26px; flex-shrink: 0; }
.pb-spec i { width: 3.5px; border-radius: 2px; background: var(--accent-grad); height: 30%; opacity: .55; }
.player-bar.playing .pb-spec i { animation: spec .9s ease-in-out infinite alternate; }
.player-bar.playing .pb-spec i:nth-child(2) { animation-delay: .12s; }
.player-bar.playing .pb-spec i:nth-child(3) { animation-delay: .24s; }
.player-bar.playing .pb-spec i:nth-child(4) { animation-delay: .36s; }
.player-bar.playing .pb-spec i:nth-child(5) { animation-delay: .48s; }
@keyframes spec { from { height: 22%; opacity: .45; } to { height: 95%; opacity: 1; } }

/* ---------- 公告栏滑动入场 ---------- */
.announce-bar { animation: annIn .5s cubic-bezier(.22,1.2,.36,1) both .4s; }
@keyframes annIn { from { transform: translateX(-50%) translateY(-110%); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }

/* ---------- 视图过渡（View Transitions API） ---------- */
::view-transition-old(root) { animation: vtOut .18s ease both; }
::view-transition-new(root) { animation: vtIn .22s ease both; }
@keyframes vtOut { to { opacity: 0; transform: translateY(-6px); } }
@keyframes vtIn { from { opacity: 0; transform: translateY(10px); } }

/* ---------- 命令面板毛玻璃 ---------- */
.cmdk-box { backdrop-filter: blur(22px); }
.cmdk-item .ci-icon { transition: transform .15s; }
.cmdk-item:hover .ci-icon { transform: scale(1.12) rotate(-5deg); }

/* ============================================================
 * 视觉升级 · V3（海报/打赏/徽章墙/Dock/气泡/空状态/页面标题）
 * ============================================================ */

/* ---------- 页面标题统一美化 ---------- */
.page-title { position: relative; }
.page-title .pt-icon {
  width: 44px; height: 44px; border-radius: 14px; display: inline-flex;
  align-items: center; justify-content: center; font-size: 22px;
  background: var(--accent-grad); box-shadow: 0 6px 16px var(--accent-soft);
  flex-shrink: 0;
}
.page-title::after {
  content: ''; position: absolute; left: 0; bottom: -8px; width: 56px; height: 4px;
  border-radius: 3px; background: var(--accent-grad); opacity: .8;
}

/* ---------- 空状态美化 ---------- */
.empty-tip { position: relative; }
.empty-tip .empty-icon {
  width: 84px; height: 84px; margin: 0 auto 12px; line-height: 84px; font-size: 40px;
  border-radius: 50%; border: 2px dashed var(--border);
  background: var(--bg2); opacity: 1 !important;
}

/* ---------- 评论气泡化 ---------- */
.comment .c-content {
  position: relative; background: var(--bg2); border-radius: 4px 14px 14px 14px;
  padding: 10px 14px; margin: 6px 0 8px;
}
.comment .c-replies .comment .c-content { background: var(--card); border: 1px solid var(--border); }
.comment.own-comment .c-content { background: var(--accent-soft); }

/* ---------- 时间线节点脉冲 ---------- */
.timeline-item::before { animation: tlPulse 2.6s ease-out infinite; }
@keyframes tlPulse {
  0% { box-shadow: 0 0 0 0 var(--accent-soft); }
  60% { box-shadow: 0 0 0 9px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}

/* ---------- 博主徽章墙 ---------- */
.badge-wall { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.badge-wall .bw {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
  color: var(--text2); background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 13px; box-shadow: var(--shadow);
  transition: all var(--trans); cursor: default;
}
.badge-wall .bw:hover { transform: translateY(-2px) scale(1.03); color: var(--accent); border-color: var(--accent); }
.badge-wall .bw .bw-i { font-size: 14px; }

/* ---------- Hero 时钟徽章 ---------- */
.hero-clock {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
  font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.hero-clock b { color: var(--accent); font-size: 14px; letter-spacing: 1px; }

/* ---------- 文章 Banner ---------- */
.post-banner {
  position: relative; height: 240px; border-radius: var(--radius); overflow: hidden;
  margin-bottom: 22px; box-shadow: var(--shadow);
}
.post-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
.post-banner .pb-grad { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,14,26,.05) 40%, rgba(8,14,26,.55)); }

/* ---------- 打赏按钮与弹窗 ---------- */
.action-btn.reward { color: #f59e0b; border-color: rgba(245,158,11,.45); }
.action-btn.reward:hover { border-color: #f59e0b; color: #d97706; background: rgba(245,158,11,.08); }
.reward-box { width: 360px; max-width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; text-align: center; animation: popIn .18s ease; }
.reward-box h3 { margin: 0 0 6px; }
.reward-box .rw-text { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.reward-box img { width: 240px; border-radius: 12px; box-shadow: var(--shadow); }

/* ---------- 分享海报 ---------- */
.poster-wrap { display: flex; justify-content: center; margin: 12px 0; }
.poster-wrap canvas { border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: 100%; }
.share-actions { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }

/* ---------- 悬浮 Dock ---------- */
.dock {
  position: fixed; right: 18px; top: 50%; transform: translateY(-50%); z-index: 900;
  display: flex; flex-direction: column; gap: 8px; padding: 8px 6px;
  background: var(--header-bg); backdrop-filter: blur(14px);
  border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.dock.show { opacity: 1; pointer-events: auto; }
.dock button {
  width: 38px; height: 38px; border: none; border-radius: 12px; background: transparent;
  color: var(--text2); font-size: 16px; transition: all var(--trans);
}
.dock button:hover { background: var(--accent-soft); color: var(--accent); transform: scale(1.08); }
@media (max-width: 1240px) { .dock { display: none; } }

/* ---------- 快捷键帮助 ---------- */
.keys-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; text-align: left; margin-top: 8px; }
.keys-grid .kg { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--text2); }
.keys-grid kbd {
  min-width: 52px; text-align: center; background: var(--bg2); border: 1px solid var(--border);
  border-bottom-width: 2.5px; border-radius: 7px; padding: 3px 8px; font-size: 12px; color: var(--text);
  font-family: ui-monospace, monospace;
}
.keys-grid .kc { flex: 1; }

/* ---------- 搜索分组 ---------- */
.cmdk-group { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; padding: 10px 12px 4px; }
.cmdk-item .ci-badge { font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 1px 7px; }

/* ---------- 主题色弹窗 ---------- */
.accent-box { width: 300px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; animation: popIn .18s ease; }
.accent-box input[type="color"] { width: 72px; height: 72px; border: none; border-radius: 50%; cursor: pointer; background: none; padding: 0; }
.accent-presets { display: flex; gap: 8px; justify-content: center; margin: 14px 0 4px; flex-wrap: wrap; }
.accent-presets button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--border); cursor: pointer; transition: transform .15s; }
.accent-presets button:hover { transform: scale(1.15); }

/* ---------- 文章头图大图化（有 cover 时） ---------- */
.post-cover { cursor: zoom-in; }

/* ============================================================
 * 视觉升级 · V4（开屏/看板娘/3D标签云/粒子星系/护眼/打卡/移动增强）
 * ============================================================ */

/* ---------- 开屏动画 ---------- */
#splash {
  position: fixed; inset: 0; z-index: 3000; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
  background: var(--bg); transition: opacity .5s ease, visibility .5s;
}
#splash.gone { opacity: 0; visibility: hidden; pointer-events: none; }
#splash .sp-logo {
  width: 84px; height: 84px; border-radius: 26px; background: var(--accent-grad);
  color: #fff; font-size: 40px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  animation: spPop .7s cubic-bezier(.22,1.4,.36,1) both;
  box-shadow: 0 16px 48px var(--accent-soft);
}
#splash .sp-name {
  font-size: 26px; font-weight: 800; letter-spacing: 2px; color: var(--text);
  background: linear-gradient(120deg, var(--text) 30%, var(--accent) 75%, var(--accent2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: spUp .6s .15s ease both;
}
#splash .sp-sub { font-size: 13px; color: var(--muted); animation: spUp .6s .25s ease both; }
#splash .sp-bar { width: 180px; height: 3px; border-radius: 3px; background: var(--border); overflow: hidden; animation: spUp .6s .3s ease both; }
#splash .sp-bar i { display: block; height: 100%; width: 0; background: var(--accent-grad); border-radius: 3px; animation: spBar 1.1s .2s cubic-bezier(.3,.8,.4,1) forwards; }
@keyframes spPop { from { opacity: 0; transform: scale(.5) rotate(-12deg); } to { opacity: 1; transform: none; } }
@keyframes spUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes spBar { 40% { width: 62%; } 70% { width: 78%; } to { width: 100%; } }

/* ---------- 吉祥物看板娘 ---------- */
.mascot {
  position: fixed; right: 18px; bottom: 96px; z-index: 930; display: flex; align-items: flex-end; gap: 6px;
  animation: mIn .5s cubic-bezier(.22,1.3,.36,1) both 1.2s;
}
@keyframes mIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: none; } }
.mascot .m-body {
  width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; font-size: 30px;
  background: var(--card); box-shadow: var(--shadow); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  transition: transform .2s; animation: mBounce 3s ease-in-out infinite;
}
.mascot .m-body:hover { transform: scale(1.12) rotate(-8deg); }
@keyframes mBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.mascot .m-bubble {
  max-width: 200px; background: var(--card); border: 1px solid var(--border);
  border-radius: 12px 12px 3px 12px; padding: 9px 13px; font-size: 12.5px; color: var(--text2);
  box-shadow: var(--shadow); position: relative; animation: mIn .4s .3s ease both;
}
.mascot .m-bubble .m-close {
  position: absolute; top: -7px; right: -7px; width: 18px; height: 18px; border-radius: 50%;
  border: none; background: var(--muted); color: #fff; font-size: 11px; cursor: pointer;
}
@media (max-width: 860px) { .mascot { right: 12px; bottom: 150px; } .mascot .m-bubble { max-width: 150px; } }

/* ---------- 3D 旋转标签云 ---------- */
.cloud3d-wrap { position: relative; height: 380px; margin: 10px 0 26px; cursor: grab; }
.cloud3d-wrap:active { cursor: grabbing; }
.cloud3d-wrap canvas { width: 100%; height: 100%; display: block; }
.cloud3d-tip { text-align: center; color: var(--muted); font-size: 12px; margin-top: -16px; margin-bottom: 16px; }

/* ---------- 粒子星系背景 ---------- */
#galaxyCanvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
html[data-bgdeco="galaxy"] #galaxyCanvas { display: block; }

/* ---------- 护眼纸张模式 ---------- */
html[data-eyecare="on"] body { background: #f5efdf; }
html[data-eyecare="on"] .site-header { background: rgba(245, 239, 223, .9); }
html[data-eyecare="on"] .post-wrap, html[data-eyecare="on"] .card, html[data-eyecare="on"] .post-card,
html[data-eyecare="on"] .site-footer, html[data-eyecare="on"] .comment-form {
  background: #faf6e9 !important; border-color: #e8dfc8 !important;
}
html[data-eyecare="on"] body { --text: #4a4232; --text2: #6b6250; }
.icon-btn.eyecare-on { color: #b45309; background: rgba(245, 158, 11, .15); }

/* ---------- 打卡日历 ---------- */
.checkin-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; margin: 0 0 22px; box-shadow: var(--shadow);
}
.checkin-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.checkin-head .ck-title { font-weight: 700; font-size: 14.5px; }
.checkin-head .ck-streak { font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 2px 10px; font-weight: 700; }
.checkin-head .sp { flex: 1; }
.ck-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.ck-cell {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 8px; font-size: 12px; color: var(--muted); background: var(--bg2);
  position: relative;
}
.ck-cell.dim { opacity: .3; }
.ck-cell.checked { background: var(--accent-grad); color: #fff; font-weight: 700; }
.ck-cell.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.ck-cell .ck-dot { position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: #f59e0b; }
.ck-btn-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.ck-btn-row .ck-info { color: var(--muted); font-size: 12px; }

/* ---------- 已读徽章 / 猜你喜欢 ---------- */
.pc-readbadge {
  position: absolute; top: 10px; left: 10px; z-index: 3; font-size: 11px; font-weight: 700;
  color: #fff; background: rgba(16, 185, 129, .92); border-radius: 12px; padding: 2px 10px;
  display: inline-flex; align-items: center; gap: 4px; backdrop-filter: blur(4px);
}
.guess-strip { margin: 0 0 24px; }
.guess-strip .cs-title { font-size: 12.5px; color: var(--muted); letter-spacing: 1px; margin-bottom: 8px; }

/* ---------- 移动端目录抽屉 ---------- */
.toc-fab { display: none; }
@media (max-width: 1419px) {
  .toc-fab {
    display: inline-flex; align-items: center; justify-content: center;
    position: fixed; left: 14px; bottom: 74px; z-index: 920; width: 40px; height: 40px;
    border-radius: 12px; border: 1px solid var(--border); background: var(--card);
    color: var(--text2); font-size: 17px; box-shadow: var(--shadow);
  }
}
.toc-drawer {
  position: fixed; left: 0; top: 0; bottom: 0; width: min(300px, 82vw); z-index: 1200;
  background: var(--card); box-shadow: 8px 0 40px rgba(0,0,0,.18); padding: 18px;
  transform: translateX(-102%); transition: transform .28s cubic-bezier(.3,.9,.3,1);
  overflow-y: auto;
}
.toc-drawer.open { transform: none; }
.toc-drawer .td-title { font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.toc-drawer a { display: block; padding: 8px 10px; border-radius: 8px; color: var(--text2); font-size: 14px; }
.toc-drawer a.l2 { padding-left: 22px; }
.toc-drawer a.l3 { padding-left: 34px; }
.toc-drawer a:hover { background: var(--accent-soft); color: var(--accent); }
.toc-mask { position: fixed; inset: 0; z-index: 1150; background: rgba(10,15,25,.4); opacity: 0; pointer-events: none; transition: opacity .25s; }
.toc-mask.show { opacity: 1; pointer-events: auto; }

/* ---------- 移动端底部导航栏 ---------- */
.m-dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 940; display: none;
  background: var(--header-bg); backdrop-filter: blur(16px); border-top: 1px solid var(--border);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
.m-dock .md-row { display: flex; justify-content: space-around; }
.m-dock button {
  border: none; background: transparent; color: var(--text2); font-size: 19px;
  display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 14px; border-radius: 10px;
}
.m-dock button small { font-size: 10px; }
.m-dock button:hover { color: var(--accent); }
@media (max-width: 860px) { .m-dock { display: block; } body { padding-bottom: 58px; } }

/* ============================================================
 * 视觉升级 · V5 「纸墨」— Opus 编辑风
 * 奶油纸底 / 衬线标题 / 赤陶点缀 / 发丝描边 / 克制阴影
 * 所有覆盖均限定 html[data-theme="opus"]，不影响其他主题
 * ============================================================ */

/* ---------- 主题变量：纸墨（浅色） ---------- */
html[data-theme="opus"] {
  --bg: #faf9f5; --bg2: #f2f0e8; --card: #fffefb;
  --text: #26241f; --text2: #59544a; --muted: #8f887a;
  --border: #e7e3d8; --accent: #c25f3f; --accent2: #9a4a30;
  --accent-soft: rgba(194, 95, 63, .07);
  --accent-grad: linear-gradient(135deg, #c25f3f, #b5552f);
  --shadow: 0 1px 2px rgba(45, 38, 25, .04), 0 5px 18px rgba(45, 38, 25, .05);
  --radius: 10px;
  --header-bg: rgba(250, 249, 245, .88);
  --font-serif: Georgia, "Times New Roman", "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
}
/* 纸墨 · 深色变体（暖炭黑） */
html[data-theme="opus"][data-mode="dark"] {
  --bg: #1d1a16; --bg2: #242019; --card: #29241d;
  --text: #eae4d6; --text2: #b3ab99; --muted: #7d7565;
  --border: #38322a; --accent: #d47a56; --accent2: #b56544;
  --accent-soft: rgba(212, 122, 86, .1);
  --header-bg: rgba(29, 26, 22, .88);
}

/* ---------- 排版基调：衬线标题 ---------- */
html[data-theme="opus"] .hero-info h1,
html[data-theme="opus"] .post-head h1,
html[data-theme="opus"] .pc-title,
html[data-theme="opus"] .page-title,
html[data-theme="opus"] .md h2,
html[data-theme="opus"] .md h3,
html[data-theme="opus"] .md h4,
html[data-theme="opus"] .hero-typing,
html[data-theme="opus"] .cs-card .cst,
html[data-theme="opus"] .timeline-item .tl-title,
html[data-theme="opus"] .comment .c-name,
html[data-theme="opus"] .shelf-body .s-title,
html[data-theme="opus"] .music-row .m-title {
  font-family: var(--font-serif);
  letter-spacing: .2px;
}
html[data-theme="opus"] .md { line-height: 2; }
html[data-theme="opus"] .md p { margin-bottom: 1.15em; }

/* ---------- Hero：书卷气 ---------- */
html[data-theme="opus"] .hero { padding: 64px 0 40px; }
html[data-theme="opus"] .hero-info h1 {
  font-size: 42px; font-weight: 700; letter-spacing: 1px;
  background: none; -webkit-background-clip: initial; background-clip: initial;
  color: var(--text);
}
html[data-theme="opus"] .hero-typing { font-style: italic; color: var(--text2); font-size: 16px; }
html[data-theme="opus"] .hero-typing .tw-caret { background: var(--accent); width: 1.5px; }
html[data-theme="opus"] .hero-meta { font-size: 13.5px; color: var(--muted); gap: 6px 18px; }
html[data-theme="opus"] .hero-meta b { color: var(--accent); font-weight: 700; font-family: var(--font-serif); }
html[data-theme="opus"] .hero-mark {
  border-radius: 50%; background: var(--accent); font-family: var(--font-serif);
}
html[data-theme="opus"] .hero-avatar { border-radius: 50%; border-color: var(--border); }
html[data-theme="opus"] .greet-line { font-style: italic; }
/* 极简时钟：并入 meta 行气质 */
html[data-theme="opus"] .hero-clock { margin-top: 12px; }

/* 徽章墙 → 发丝胶囊 */
html[data-theme="opus"] .badge-wall .bw {
  background: transparent; box-shadow: none; border-color: var(--border);
  color: var(--text2); font-weight: 500; border-radius: 999px;
}
html[data-theme="opus"] .badge-wall .bw:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
/* 社交图标 → 方形极简 */
html[data-theme="opus"] .hero-socials a { border-radius: 8px; font-family: var(--font-serif); font-weight: 600; box-shadow: none; }

/* ---------- 背景装饰：纸感收敛 ---------- */
html[data-theme="opus"] .bg-deco i { opacity: 0 !important; }  /* 纸墨默认不用光斑 */
html[data-theme="opus"][data-bgdeco="aurora"] .bg-deco i { opacity: .07 !important; filter: blur(130px); }
html[data-theme="opus"][data-bgdeco="grid"] .bg-grid { opacity: .35; }
html[data-theme="opus"] #spotlight { opacity: 0 !important; }  /* 光晕与纸感冲突 */

/* ---------- 顶栏：细线 + 衬线 Logo ---------- */
html[data-theme="opus"] .site-header { border-bottom: 1px solid var(--border); }
html[data-theme="opus"] .logo { font-family: var(--font-serif); font-weight: 700; letter-spacing: .5px; }
html[data-theme="opus"] .logo .logo-mark { border-radius: 50%; background: var(--accent); font-family: var(--font-serif); }
html[data-theme="opus"] .main-nav a { border-radius: 6px; font-size: 14px; }
html[data-theme="opus"] .main-nav a.active { background: transparent; font-weight: 700; }
html[data-theme="opus"] .main-nav a::after { bottom: -4px; height: 2px; }

/* ---------- 卡片：平面 + 发丝线 ---------- */
html[data-theme="opus"] .post-card {
  box-shadow: none; border-color: var(--border);
  transition: border-color var(--trans), box-shadow var(--trans);
}
html[data-theme="opus"] .post-card:hover {
  transform: none; box-shadow: 0 1px 2px rgba(45,38,25,.05), 0 10px 28px rgba(45,38,25,.07);
  border-color: #d8d2c2;
}
html[data-theme="opus"] .pc-glare { display: none; }
html[data-theme="opus"] .pc-coverwrap .pc-covergrad { background: linear-gradient(180deg, transparent 62%, rgba(38, 30, 20, .32)); }
html[data-theme="opus"] .pc-coverwrap .pc-coverbadge { background: rgba(38, 30, 20, .55); border-radius: 4px; font-size: 11px; letter-spacing: 1px; }
html[data-theme="opus"] .badge { border-radius: 4px; letter-spacing: .5px; }
html[data-theme="opus"] .badge.type { background: transparent; border: 1px solid var(--border); color: var(--muted); }
html[data-theme="opus"] .badge.pin { background: var(--accent); font-weight: 600; }
html[data-theme="opus"] .pc-title { font-size: 17.5px; }
html[data-theme="opus"] .pc-title a:hover { color: var(--accent); }
html[data-theme="opus"] .pc-quote { font-size: 16px; color: var(--text); }
html[data-theme="opus"] .pc-tags a { border-radius: 3px; background: transparent; border: 1px solid var(--border); }
html[data-theme="opus"] .pc-tags a:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
html[data-theme="opus"] .pc-foot { border-top: 1px solid var(--border); padding-top: 9px; }

/* ---------- 每日一句：引文卡 ---------- */
html[data-theme="opus"] .daily-quote {
  background: var(--card); color: var(--text);
  border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: var(--radius); box-shadow: none; padding: 24px 28px;
}
html[data-theme="opus"] .daily-quote .dq-text { font-family: var(--font-serif); font-size: 19px; line-height: 1.9; }
html[data-theme="opus"] .daily-quote .dq-from { color: var(--muted); }
html[data-theme="opus"] .daily-quote::before { color: var(--accent); opacity: .25; font-size: 76px; top: -6px; }
html[data-theme="opus"] .daily-quote .dq-refresh { background: transparent; color: var(--muted); border: 1px solid var(--border); }
html[data-theme="opus"] .daily-quote .dq-refresh:hover { color: var(--accent); border-color: var(--accent); }

/* ---------- 按钮去渐变 ---------- */
html[data-theme="opus"] .btn.primary { background: var(--accent); }
html[data-theme="opus"] .btn.primary:hover { background: var(--accent2); box-shadow: 0 3px 10px rgba(194,95,63,.25); }
html[data-theme="opus"] .action-btn { border-radius: 8px; box-shadow: none; background: var(--card); }
html[data-theme="opus"] .action-btn:hover { transform: none; background: var(--accent-soft); }
html[data-theme="opus"] .action-btn.liked { background: var(--accent-soft); border-color: var(--accent); }

/* ---------- 文章页 ---------- */
html[data-theme="opus"] .post-head h1 { font-size: 34px; line-height: 1.45; letter-spacing: .3px; }
html[data-theme="opus"] .post-meta .badge.type { margin-bottom: 2px; }
html[data-theme="opus"] .md h2 { border-left: none; padding-left: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; font-size: 1.5em; }
html[data-theme="opus"] .md h3 { font-size: 1.22em; }
html[data-theme="opus"] .md blockquote {
  background: var(--bg2); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
  font-family: var(--font-serif);
}
html[data-theme="opus"] .md pre { border-radius: 8px; border: 1px solid #2a2f3a; }
html[data-theme="opus"] .copyright-box { border-radius: 8px; font-style: italic; font-size: 12.5px; }
html[data-theme="opus"] .post-nav a { border-radius: 8px; box-shadow: none; }
html[data-theme="opus"] .post-nav a:hover { transform: none; }

/* ---------- 归档/时间线 ---------- */
html[data-theme="opus"] .archive-year { font-family: var(--font-serif); color: var(--text); letter-spacing: 1px; }
html[data-theme="opus"] .archive-item { border-bottom: 1px solid var(--border); }
html[data-theme="opus"] .archive-item:hover { padding-left: 12px; background: var(--accent-soft); }
html[data-theme="opus"] .timeline::before { background: var(--border); }
html[data-theme="opus"] .timeline-item::before { background: var(--accent); animation: none; box-shadow: none; }

/* ---------- 页面标题 ---------- */
html[data-theme="opus"] .page-title .pt-icon {
  background: transparent; color: var(--accent); box-shadow: none;
  border: 1px solid var(--border); border-radius: 10px; font-size: 20px;
}
html[data-theme="opus"] .page-title::after { width: 40px; height: 2px; opacity: 1; }
html[data-theme="opus"] .page-title { font-size: 22px; letter-spacing: .5px; }

/* ---------- 评论气泡 → 纸片 ---------- */
html[data-theme="opus"] .comment .c-content { background: var(--bg2); border-radius: 0 10px 10px 10px; }
html[data-theme="opus"] .comment .c-avatar { border-radius: 8px; font-family: var(--font-serif); }
html[data-theme="opus"] .c-badge { background: var(--accent); }

/* ---------- 空状态 / 相册 / 书影音 ---------- */
html[data-theme="opus"] .empty-tip .empty-icon { background: transparent; border-color: var(--border); }
html[data-theme="opus"] .shelf-card { box-shadow: none; }
html[data-theme="opus"] .shelf-card:hover { transform: none; border-color: #d8d2c2; box-shadow: 0 6px 20px rgba(45,38,25,.08); }
html[data-theme="opus"] .stars { color: var(--accent); }
html[data-theme="opus"] .friend-card { box-shadow: none; border-radius: 8px; }
html[data-theme="opus"] .friend-card:hover { transform: none; border-color: #d8d2c2; }
html[data-theme="opus"] .music-row { border-radius: 8px; box-shadow: none; }
html[data-theme="opus"] .music-row .m-cover { background: var(--accent); border-radius: 8px; }
html[data-theme="opus"] .music-row .m-play { background: var(--accent); border-radius: 8px; }
html[data-theme="opus"] .album-item { border-radius: 8px; }

/* ---------- 命令面板 / 弹窗 ---------- */
html[data-theme="opus"] .cmdk-box { border-radius: 12px; box-shadow: 0 24px 70px rgba(30,24,14,.22); }
html[data-theme="opus"] .cmdk-item { border-radius: 8px; }
html[data-theme="opus"] .cmdk-item .ci-icon { border-radius: 8px; background: var(--bg2); }
html[data-theme="opus"] .confirm-box, html[data-theme="opus"] .reward-box { border-radius: 12px; }
html[data-theme="opus"] .qr-wrap svg { border-radius: 6px; border: 1px solid var(--border); }

/* ---------- 打卡/继续阅读/猜你喜欢 ---------- */
html[data-theme="opus"] .checkin-card { box-shadow: none; border-radius: 8px; }
html[data-theme="opus"] .ck-cell { border-radius: 6px; }
html[data-theme="opus"] .ck-cell.checked { background: var(--accent); }
html[data-theme="opus"] .cs-card { box-shadow: none; border-radius: 8px; background: var(--card); }
html[data-theme="opus"] .cs-card:hover { transform: none; border-color: #d8d2c2; box-shadow: 0 4px 14px rgba(45,38,25,.07); }
html[data-theme="opus"] .cs-card .cs-bar { border-radius: 2px; }
html[data-theme="opus"] .cs-card .cs-bar i { background: var(--accent); }

/* ---------- Dock / 返回顶部 ---------- */
html[data-theme="opus"] .dock { border-radius: 14px; }
html[data-theme="opus"] .dock button { border-radius: 9px; font-size: 15px; }
html[data-theme="opus"] .back-top { border-radius: 10px; }
html[data-theme="opus"] .back-top .rt-bar { stroke: var(--accent); }

/* ---------- 看板娘 / 播放器 / 公告 ---------- */
html[data-theme="opus"] .mascot .m-body { border-radius: 50%; }
html[data-theme="opus"] .mascot .m-bubble { border-radius: 10px 10px 3px 10px; font-style: italic; }
html[data-theme="opus"] .player-bar { border-radius: 12px; }
html[data-theme="opus"] .pb-toggle { background: var(--accent); border-radius: 8px; }
html[data-theme="opus"] .pb-spec i { background: var(--accent); }
html[data-theme="opus"] .announce-bar {
  background: var(--card); color: var(--text2); border: 1px solid var(--border);
  border-top: none; border-radius: 0 0 10px 10px; font-style: italic;
}
html[data-theme="opus"] .announce-icon { filter: none; }
html[data-theme="opus"] .announce-close { color: var(--muted); }

/* ---------- 开屏（纸墨版） ---------- */
html[data-theme="opus"] #splash { background: var(--bg); }
html[data-theme="opus"] #splash .sp-logo {
  background: transparent; color: var(--accent); border-radius: 0;
  font-family: var(--font-serif); font-size: 58px; box-shadow: none;
  border-bottom: 2px solid var(--accent); padding: 0 8px 6px;
  animation: spFade 1s ease both;
}
html[data-theme="opus"] #splash .sp-name { font-family: var(--font-serif); letter-spacing: 6px; background: none; -webkit-background-clip: initial; color: var(--text); animation: spFade 1s .15s ease both; }
html[data-theme="opus"] #splash .sp-sub { font-style: italic; letter-spacing: 2px; }
html[data-theme="opus"] #splash .sp-bar { background: var(--bg2); }
html[data-theme="opus"] #splash .sp-bar i { background: var(--accent); }
@keyframes spFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- 3D 标签云配色 ---------- */
html[data-theme="opus"] .cloud3d-tip { font-style: italic; }
html[data-theme="opus"] .tagcloud a { border-radius: 6px; background: transparent; }

/* ---------- 进度条 ---------- */
html[data-theme="opus"] .progress-bar { background: var(--accent); }

/* ---------- 移动端 ---------- */
@media (max-width: 860px) {
  html[data-theme="opus"] .hero-info h1 { font-size: 32px; }
  html[data-theme="opus"] .post-head h1 { font-size: 26px; }
}

/* 打卡格子在纸墨下的对比度 */
html[data-theme="opus"] .ck-cell { background: transparent; border: 1px solid var(--border); color: var(--muted); }
html[data-theme="opus"] .ck-cell.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
html[data-theme="opus"] .ck-cell.today { outline-color: var(--accent); }
html[data-theme="opus"] .checkin-card { background: var(--bg2); }

/* 公告出现时正文让位 */
body.has-announce .view { padding-top: calc(var(--nav-h) + 40px); transition: padding-top .3s; }
body.has-announce .announce-bar { top: calc(var(--nav-h) + 8px); border-radius: 10px; }

/* ============================================================
 * V5.1 编辑部排版（纸墨专属）
 * ============================================================ */

/* ---------- 首页信息流 → 杂志条目式 ---------- */
html[data-theme="opus"] .feed-grid { grid-template-columns: 1fr; gap: 0; }
html[data-theme="opus"] .post-card {
  display: flex; flex-direction: row; gap: 20px; align-items: flex-start;
  background: transparent; border: none; border-bottom: 1px solid var(--border);
  border-radius: 0; padding: 24px 6px; box-shadow: none; contain-intrinsic-size: auto 150px;
}
html[data-theme="opus"] .post-card:hover {
  background: var(--accent-soft); border-color: var(--border);
  box-shadow: none; transform: none;
}
html[data-theme="opus"] .post-card .pc-body { padding: 0; flex: 1; min-width: 0; gap: 7px; }
html[data-theme="opus"] .post-card .pc-top { margin-bottom: 0; }
html[data-theme="opus"] .post-card .pc-title { font-size: 20px; line-height: 1.5; }
html[data-theme="opus"] .post-card .pc-excerpt { -webkit-line-clamp: 2; color: var(--text2); }
html[data-theme="opus"] .post-card .pc-foot { margin-top: 4px; font-size: 12px; }
html[data-theme="opus"] .post-card .pc-tags { margin-top: 2px; }
/* 首条（置顶）放大处理 */
html[data-theme="opus"] .feed-grid .post-card:first-child { padding-top: 10px; }
html[data-theme="opus"] .feed-grid .post-card:first-child .pc-title { font-size: 24px; }
/* 封面 → 右侧小图（报刊排版） */
html[data-theme="opus"] .post-card .pc-coverwrap,
html[data-theme="opus"] .post-card .pc-video { order: 2; }
html[data-theme="opus"] .post-card .pc-video { display: contents; }
html[data-theme="opus"] .post-card .pc-coverwrap {
  width: 148px; height: 96px; flex-shrink: 0; border-radius: 6px; overflow: hidden;
  position: relative; margin-top: 3px;
}
html[data-theme="opus"] .post-card .pc-coverwrap .pc-cover { width: 100%; height: 100%; }
html[data-theme="opus"] .post-card .pc-coverwrap .pc-covergrad { display: none; }
html[data-theme="opus"] .post-card .pc-coverwrap .pc-coverbadge { display: none; }
/* 相册多图 → 右侧马赛克小图 */
html[data-theme="opus"] .post-card .pc-imgs {
  order: 2; width: 148px; flex-shrink: 0; margin: 3px 0 0;
  grid-template-columns: 1fr 1fr; gap: 3px;
}
html[data-theme="opus"] .post-card .pc-imgs img { aspect-ratio: 1; border-radius: 4px; }
html[data-theme="opus"] .post-card .pc-imgs.n1 { grid-template-columns: 1fr; }
/* 语录条目 → 衬线引文 */
html[data-theme="opus"] .post-card .pc-quote {
  font-size: 18px; line-height: 1.9; color: var(--text);
  padding-left: 14px; border-left: 2px solid var(--accent);
}
/* 分页提示 */
html[data-theme="opus"] .feed-more { font-style: italic; letter-spacing: 2px; }

/* ---------- 文章页：首字下沉 ---------- */
html[data-theme="opus"] .post-content > .md-p:first-of-type::first-letter {
  font-family: var(--font-serif); font-size: 3.1em; font-weight: 700;
  float: left; line-height: .92; padding: 5px 10px 0 0; color: var(--accent);
}

/* ---------- 代码块暖色描边 ---------- */
html[data-theme="opus"] .md pre { border: 1px solid rgba(125, 105, 75, .28); }

/* ---------- Hero 底部细线 + 分隔点 ---------- */
html[data-theme="opus"] .hero { border-bottom: 1px solid var(--border); margin-bottom: 26px; }
html[data-theme="opus"] .hero-meta span:not(:first-child)::before {
  content: '·'; color: var(--muted); opacity: .5; margin: 0 13px;

/* ---------- TOC 衬线化 ---------- */

re><h2 id=\"3-交换变量不用中间量\">3. 交换变量不用中间量</h2><pre class=\"md-code\"><code class=\"lang-js\">[a, b] = [b, a];</code></pre><h2 id=\"4-千分位格式化\">4. 千分位格式化</h2><pre class=\"md-code\"><code class=\"lang-js\">(1234567.89).toLocaleString('en-US'); // \"1,234,567.89\"</code></pre><h2 id=\"5-深拷贝一行流\">5. 深拷贝一行流</h2><pre class=\"md-code\"><code class=\"lang-js\">const copy = structuredClone(obj);</code></pre><blockquote class=\"md-quote\"><p class=\"md-p\">还有很多，比如 <code class=\"md-icode\">Object.groupBy</code>、<code class=\"md-icode\">Array.prototype.at</code>、<code class=\"md-icode\">Promise.allSettled</code>…… 用起来！</p></blockquote><p class=\"md-p\"><mark>持续更新中</mark>，收藏这篇就够啦 ✨</p>","text":"整理了 20 个日常开发中特别好用的 JS 技巧，每个都附上例子。\n1. 可选链与空值合并\nconst city = user?.address?.city ?? '未知城市';\n2. 数组去重的三种姿势\nconst uniq = [...new Set(arr)]; const uniqObj = arr.filter((x, i) => arr.indexOf(x) === i); const uniqBy = (arr, key) => [...new Map(arr.map(x => [x[key], x])).values()];\n3. 交换变量不用中间量\n[a, b] = [b, a];\n4. 千分位格式化\n(1234567.89).toLocaleString('en-US'); // \"1,234,567.89\"\n5. 深拷贝一行流\nconst copy = structuredClone(obj);\n> 还有很多，比如 `Object.groupBy`、`Array.prototype.at`、`Promise.allSettled`…… 用起来！\n==持续更新中==，收藏这篇就够啦 ✨","toc":[{"id":"1-可选链与空值合并","text":"1. 可选链与空值合并","level":2},{"id":"2-数组去重的三种姿势","text":"2. 数组去重的三种姿势","level":2},{"id":"3-交换变量不用中间量","text":"3. 交换变量不用中间量","level":2},{"id":"4-千分位格式化","text":"4. 千分位格式化","level":2},{"id":"5-深拷贝一行流","text":"5. 深拷贝一行流","level":2}],"excerpt":"整理了 20 个日常开发中特别好用的 JS 技巧，每个都附上例子。 1. 可选链与空值合并 const city = user?.address?.city ?? '未知城市'; ","cover":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22800%22%20height%3D%22450%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23b8860b%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%238a5a2e%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22800%22%20height%3D%22450%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%22400%22%20y%3D%22235%22%20font-size%3D%2246%22%20fill%3D%22%23ffffffdd%22%20text-anchor%3D%22middle%22%20font-family%3D%22sans-serif%22%3EJS%20%E6%8A%80%E5%B7%A7%E5%90%88%E9%9B%86%3C%2Ftext%3E%3C%2Fsvg%3E","images":[],"video":null,"music":null,"link":null,"quote":"","tags":["前端","JavaScript","技巧"],"category":"技术","series":"","seriesIndex":null,"pinned":false,"publishedAt":1791644435909,"wordCount":497,"readingTime":1,"likes":128,"baseViews":1204,"milestones":[100,1000,10000],"protectedHash":null,"exif":null},{"id":"math-note","type":"article","title":"用 5 分钟看懂傅里叶变换的直觉","html":"<p class=\"md-p\">傅里叶变换说穿了就一句话：<strong>任何信号都能拆成不同频率的正弦波叠加</strong>。</p><h2 id=\"核心公式\">核心公式</h2><p class=\"md-p\">$\\int_{-\\infty}^{\\infty} f(x) e^{-2\\pi i \\xi x} \\, dx$</p><p class=\"md-p\">别怕，直觉比公式重要：</p><h2 id=\"一个比喻\">一个比喻 🎵</h2><p class=\"md-p\">- 一段和弦 = 多个单音的叠加</p><p class=\"md-p\">- 傅里叶变换 = 把和弦\"拆\"回一个个单音</p><p class=\"md-p\">- $\\xi$ 就是每个单音的<strong>频率</strong></p><h2 id=\"为什么有用\">为什么有用</h2><p class=\"md-p\">1. MP3 压缩：丢掉人耳听不见的频率</p><p class=\"md-p\">2. 图像压缩（JPEG 同理）</p><p class=\"md-p\">3. 降噪：只保留感兴趣的频段</p><blockquote class=\"md-quote\"><p class=\"md-p\">数学不是符号游戏，而是看清世界结构的方式。</p></blockquote>","text":"傅里叶变换说穿了就一句话：**任何信号都能拆成不同频率的正弦波叠加**。\n核心公式\n$\\int_{-\\infty}^{\\infty} f(x) e^{-2\\pi i \\xi x} \\, dx$\n别怕，直觉比公式重要：\n一个比喻 🎵\n- 一段和弦 = 多个单音的叠加\n- 傅里叶变换 = 把和弦\"拆\"回一个个单音\n- $\\xi$ 就是每个单音的**频率**\n为什么有用\n1. MP3 压缩：丢掉人耳听不见的频率\n2. 图像压缩（JPEG 同理）\n3. 降噪：只保留感兴趣的频段\n> 数学不是符号游戏，而是看清世界结构的方式。","toc":[{"id":"核心公式","text":"核心公式","level":2},{"id":"一个比喻","text":"一个比喻 🎵","level":2},{"id":"为什么有用","text":"为什么有用","level":2}],"excerpt":"傅里叶变换说穿了就一句话：**任何信号都能拆成不同频率的正弦波叠加**。 核心公式 $\\int_{-\\infty}^{\\infty} f(x) e^{-2\\pi i \\xi x}","cover":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22800%22%20height%3D%22450%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D /* ---------- 文章过滤工具 ---------- */
const PostUtil = {
  visible() {
    // 排除私密与未到定时时间的
    return POSTS.filter(p => !p.private && (!p.publishedAt || p.publishedAt <= Date.now()));
  },
  byId(id) { return POSTS.find(p => p.id === id); },
  published(id) {
    const p = this.byId(id) || POSTS.find(x => x.slug && x.slug === id && !x.private);
    return p && !p.private && (!p.publishedAt || p.publishedAt <= Date.now()) ? p : null;
  },
  pinned(list) { return list.filter(p => p.pinned); },
  sort(list, by) {
    const l = [...list];
    switch (by) {
      case 'oldest': return l.sort((a, b) => a.publishedAt - b.publishedAt);
      case 'likes': return l.sort((a, b) => (b.likes || 0) + (Local.likes[b.id] ? 1 : 0) - ((a.likes || 0) + (Local.likes[a.id] ? 1 : 0)));
      case 'views': return l.sort((a, b) => Local.viewCount(b.id) - Local.viewCount(a.id));
      default: return l.sort((a, b) => b.publishedAt - a.publishedAt);
    }
  },
  related(post, n = 3) {
    return this.visible()
      .filter(p => p.id !== post.id)
      .map(p => {
        let score = 0;
        const tags1 = new Set(post.tags || []);
        (p.tags || []).forEach(t => { if (tags1.has(t)) score += 3; });
        if (p.category && p.category === post.category) score += 2;
        if (p.series && p.series === post.series) score += 4;
        return { p, score };
      })
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, n)
      .map(x => x.p);
  },
  prevNext(post, sameCategory) {
    const list = this.sort(this.visible(), 'newest');
    const pool = sameCategory && post.category ? list.filter(p => p.category === post.category || p.id === post.id) : list;
    const idx = pool.findIndex(p => p.id === post.id);
    return { prev: idx > 0 ? pool[idx - 1] : null, next: idx >= 0 && idx < pool.length - 1 ? pool[idx + 1] : null };
  }
};
